<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>JaqueNinja ♟️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d1117;--card:#161b22;--card2:#21262d;
  --gold:#ffd700;--ninja:#7c3aed;--ninja2:#a78bfa;
  --text:#e6edf3;--muted:#8b949e;
  --correct:#3fb950;--wrong:#f85149;
  --board-light:#f0d9b5;--board-dark:#b58863;
  --hi:#aac244;--hi2:#cdd26a;
}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
#root{width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column}
button{cursor:pointer;border:none;font-family:inherit;transition:transform .1s,opacity .15s}
button:active{transform:scale(.96)}
.btn{display:block;width:100%;padding:14px;border-radius:12px;font-size:1rem;font-weight:700;text-align:center}
.btn-ninja{background:var(--ninja);color:#fff}
.btn-gold{background:var(--gold);color:#1a1600}
.btn-card{background:var(--card2);color:var(--text)}
.btn-sm{padding:8px 16px;border-radius:8px;font-size:.9rem;font-weight:600;display:inline-block;width:auto}
.screen{flex:1;display:flex;flex-direction:column;padding:16px;gap:12px}
.screen.center{align-items:center;justify-content:center}
/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card)}
.topbar h1{font-size:1.2rem;font-weight:800;letter-spacing:.5px}
/* welcome */
.welcome-logo{font-size:4rem;text-align:center;margin-bottom:8px}
.welcome-title{font-size:2rem;font-weight:900;text-align:center;background:linear-gradient(135deg,var(--gold),var(--ninja2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.welcome-sub{text-align:center;color:var(--muted);margin-bottom:8px}
.profile-card{background:var(--card);border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;border:2px solid transparent;transition:border-color .2s}
.profile-card:hover{border-color:var(--ninja2)}
.profile-card .avatar{font-size:3rem}
.profile-card .pname{font-weight:700;font-size:1.1rem}
.profile-card .pbelt{font-size:.85rem;color:var(--muted)}
.profile-card .pcoins{font-size:.85rem;color:var(--gold)}
.profiles-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* home */
.belt-card{background:var(--card);border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;border:2px solid transparent;transition:border-color .2s}
.belt-card:hover{border-color:var(--muted)}
.belt-card.unlocked{cursor:pointer}
.belt-card.locked{opacity:.5;cursor:default}
.belt-card.current{border-color:var(--gold)}
.belt-card.done{border-color:var(--correct)}
.belt-icon{font-size:2rem;min-width:40px;text-align:center}
.belt-info{flex:1}
.belt-name{font-weight:700;font-size:1rem}
.belt-desc{font-size:.8rem;color:var(--muted);margin-top:2px}
.belt-prog{font-size:.8rem;margin-top:4px}
.prog-bar{height:6px;background:var(--card2);border-radius:3px;margin-top:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;background:var(--ninja2);transition:width .4s}
.home-header{background:var(--card);border-radius:14px;padding:16px;display:flex;align-items:center;justify-content:space-between}
.home-avatar{font-size:2.5rem}
.home-info{}
.home-name{font-weight:700;font-size:1.1rem}
.home-belt{font-size:.85rem;color:var(--muted)}
.home-coins{font-size:.85rem;color:var(--gold);margin-top:2px}
/* lesson */
.lesson-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.lesson-belt{font-size:.85rem;color:var(--muted)}
.lesson-prog{font-size:.85rem;color:var(--gold)}
.q-card{background:var(--card);border-radius:16px;padding:20px;flex:1;display:flex;flex-direction:column;align-items:center;gap:14px}
.q-emoji{font-size:3rem;text-align:center}
.q-text{font-size:1.05rem;font-weight:700;text-align:center;line-height:1.4}
.q-fact{font-size:.85rem;color:var(--muted);text-align:center;line-height:1.5;padding:8px 0;border-top:1px solid var(--card2);width:100%}
.opts{width:100%;display:flex;flex-direction:column;gap:8px}
.opt-btn{background:var(--card2);color:var(--text);border-radius:10px;padding:12px 16px;font-size:.95rem;font-weight:600;text-align:left;border:2px solid transparent;transition:border-color .15s}
.opt-btn:disabled{cursor:default}
.opt-btn.sel-correct{background:#1a3a21;border-color:var(--correct);color:var(--correct)}
.opt-btn.sel-wrong{background:#3a1a1a;border-color:var(--wrong);color:var(--wrong)}
.opt-btn.reveal-correct{background:#1a3a21;border-color:var(--correct);color:var(--correct)}
/* board */
.board-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.board-svg-wrap{border-radius:8px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.board-hint{font-size:.85rem;color:var(--muted);text-align:center}
.board-feedback{font-size:1.1rem;font-weight:700;text-align:center;height:28px}
.board-feedback.ok{color:var(--correct)}
.board-feedback.bad{color:var(--wrong)}
/* yesno */
.yesno-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.yn-btn{background:var(--card2);border-radius:12px;padding:16px;font-size:1.1rem;font-weight:700;text-align:center;color:var(--text);border:2px solid transparent}
.yn-btn.si{border-color:var(--correct)}
.yn-btn.no{border-color:var(--wrong)}
/* result */
.result-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.result-icon{font-size:4rem}
.result-title{font-size:1.5rem;font-weight:900;text-align:center}
.result-sub{font-size:1rem;color:var(--muted);text-align:center}
.result-coins{font-size:1.2rem;font-weight:700;color:var(--gold)}
.result-stars{font-size:2rem;letter-spacing:4px}
/* boss */
.boss-banner{background:linear-gradient(135deg,#7c3aed,#dc2626);border-radius:12px;padding:12px 16px;text-align:center}
.boss-banner h3{font-size:1rem;font-weight:800}
.boss-banner p{font-size:.8rem;opacity:.85;margin-top:2px}
/* streak */
.streak-badge{display:inline-flex;align-items:center;gap:4px;background:var(--card2);border-radius:20px;padding:4px 10px;font-size:.85rem;font-weight:700}
/* parent */
.parent-section{background:var(--card);border-radius:14px;padding:16px}
.parent-section h3{font-size:1rem;font-weight:700;margin-bottom:10px}
.weak-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--card2)}
.weak-item:last-child{border-bottom:none}
.weak-name{font-size:.9rem}
.weak-count{font-size:.8rem;color:var(--wrong);font-weight:700}
/* pin */
.pin-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:32px 0}
.pin-input{display:flex;gap:8px}
.pin-dot{width:16px;height:16px;border-radius:50%;background:var(--card2);transition:background .2s}
.pin-dot.filled{background:var(--ninja2)}
.pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:200px}
.pin-key{background:var(--card2);border-radius:10px;padding:14px;font-size:1.2rem;font-weight:700;text-align:center}
/* animations */
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes fall{0%{top:-10px;opacity:1}100%{top:110vh;opacity:.6}}
@keyframes belt-in{0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.15) rotate(5deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes glow-pulse{0%,100%{filter:drop-shadow(0 0 6px #ffd700)}50%{filter:drop-shadow(0 0 18px #ffd700)}}
.anim-pop{animation:pop .3s ease}
.anim-shake{animation:shake .4s ease}
.anim-belt{animation:belt-in .6s cubic-bezier(.34,1.56,.64,1) forwards}
.piece-glow{animation:glow-pulse 1s ease infinite}
/* next btn (fixed bottom) */
.next-wrap{padding:12px 0 0}
/* mate1 */
.mate1-hint{font-size:.85rem;color:var(--gold);text-align:center;font-weight:700}
/* sensei */
.sensei-card{background:linear-gradient(135deg,#1a1040,#0d1117);border:1px solid var(--ninja);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.sensei-avatar{font-size:2.2rem;flex-shrink:0}
.sensei-text{font-size:.88rem;line-height:1.5;color:var(--text)}
.sensei-name{font-size:.75rem;color:var(--ninja2);font-weight:700;margin-bottom:4px}
.mission-tag{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border-radius:20px;padding:5px 12px;font-size:.8rem;color:var(--muted);font-style:italic}
/* daily */
.daily-card{background:linear-gradient(135deg,#1a1200,#2a1f00);border:2px solid var(--gold);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.daily-star{font-size:2rem}
.daily-info{}
.daily-title{font-size:.95rem;font-weight:800;color:var(--gold)}
.daily-sub{font-size:.8rem;color:var(--muted);margin-top:2px}
.daily-done{opacity:.6;cursor:default}
/* duelo */
.duelo-score{display:flex;justify-content:space-around;background:var(--card);border-radius:12px;padding:12px}
.duelo-player{text-align:center}
.duelo-name{font-size:.8rem;color:var(--muted)}
.duelo-pts{font-size:1.8rem;font-weight:900}
/* belt-win */
.belt-win-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.belt-win-emoji{font-size:5rem;line-height:1}
.belt-win-title{font-size:1.6rem;font-weight:900}
.belt-win-sub{font-size:.95rem;color:var(--muted)}
/* legends */
.legend-card{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border:2px solid transparent;transition:border-color .2s}
.legend-card:not(.locked):hover{border-color:var(--gold)}
.legend-card.locked{opacity:.55;cursor:default}
.legend-emoji{font-size:2.2rem;min-width:40px;text-align:center}
.legend-info{flex:1}
.legend-name{font-weight:700;font-size:.95rem}
.legend-title{font-size:.8rem;color:var(--ninja2);margin-top:2px}
.legend-belt{font-size:.75rem;color:var(--muted);margin-top:3px}
.legend-arrow{font-size:1.4rem;color:var(--muted)}
.legend-hero{background:var(--card);border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center}
.legend-hero-emoji{font-size:3.5rem;min-width:56px;text-align:center}
.legend-hero-name{font-size:1.1rem;font-weight:900}
.legend-hero-years{font-size:.8rem;color:var(--muted);margin-top:2px}
.legend-hero-title{font-size:.85rem;color:var(--ninja2);margin-top:4px;font-weight:700}
.legend-super{background:var(--card2);border-radius:10px;padding:12px 14px;font-size:.88rem;display:flex;flex-direction:column;gap:4px}
.legend-super-label{font-size:.75rem;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.legend-section-title{font-size:.8rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.facts-list{display:flex;flex-direction:column;gap:8px}
.fact-item{background:var(--card);border-radius:10px;padding:12px 14px;font-size:.88rem;line-height:1.5;border-left:3px solid var(--ninja)}
.legend-quote{font-style:italic;font-size:.9rem;color:var(--muted);text-align:center;padding:4px 8px;border-left:2px solid var(--gold);margin-left:8px}
.video-wrap{width:100%;display:flex;flex-direction:column;gap:6px}
.video-label{font-size:.78rem;color:var(--muted);text-align:center}
/* curiosidad */
.curiosidad-card{background:linear-gradient(135deg,#0a1a2a,#0d1117);border:1px solid #2563eb;border-radius:14px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.curiosidad-icon{font-size:1.6rem;flex-shrink:0}
.curiosidad-title{font-size:.75rem;color:#60a5fa;font-weight:700;margin-bottom:4px}
.curiosidad-text{font-size:.85rem;line-height:1.5}
.curiosidad-attr{font-size:.75rem;color:var(--muted);margin-top:4px}
/* ruta del gran maestro */
.ruta-section{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border:2px solid transparent;transition:border-color .2s}
.ruta-section:hover{border-color:var(--muted)}
.ruta-section-icon{width:44px;height:44px;border-radius:10px;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
.ruta-section-info{flex:1}
.ruta-section-title{font-weight:700;font-size:.95rem}
.ruta-content{display:flex;flex-direction:column;gap:14px;font-size:.9rem;line-height:1.6}
.ruta-content p{color:var(--text)}
.ruta-content b{color:var(--gold)}
.ruta-ladder{display:flex;flex-direction:column;gap:2px}
.ruta-rung{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border-left:4px solid}
.rung-gm{background:#1a0a2e;border-color:#a78bfa}
.rung-mi{background:#0a1a2e;border-color:#60a5fa}
.rung-fm{background:#0a2e1a;border-color:#34d399}
.rung-cm{background:#2e2a0a;border-color:#fbbf24}
.rung-club{background:#1a1a1a;border-color:#8b949e}
.rung-icon{font-size:1.2rem;flex-shrink:0;width:24px;text-align:center}
.rung-title{font-weight:700;font-size:.88rem}
.rung-sub{font-size:.78rem;color:var(--muted);margin-top:2px}
.ruta-fact-list{display:flex;flex-direction:column;gap:8px}
.ruta-fact{background:var(--card);border-radius:10px;padding:10px 12px;font-size:.85rem;line-height:1.5}
.ruta-ranking{display:flex;flex-direction:column;gap:8px}
.ruta-rank-item{display:flex;align-items:flex-start;gap:10px;background:var(--card);border-radius:10px;padding:10px 12px}
.rank-pos{font-size:1.3rem;flex-shrink:0;min-width:28px}
.rank-name{font-weight:700;font-size:.88rem}
.rank-age{font-size:.78rem;color:var(--muted);margin-top:2px}
.ruta-callout{background:linear-gradient(135deg,#1a1200,#2a1f00);border:1px solid var(--gold);border-radius:10px;padding:12px 14px;font-size:.85rem;line-height:1.5}
.ruta-path{display:flex;flex-direction:column;gap:0}
.path-step{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-left:2px solid var(--card2);margin-left:10px;padding-left:16px;position:relative}
.path-step:last-child{border-color:transparent}
.path-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;position:absolute;left:-9px;top:14px;box-shadow:0 0 8px currentColor}
.path-label{font-weight:700;font-size:.88rem;color:var(--text)}
.path-desc{font-size:.82rem;color:var(--muted);margin-top:3px;line-height:1.5}
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
// ═══════════════════════════════════════════════════════
//  DATA – BELTS
// ═══════════════════════════════════════════════════════
const BELTS=[
  {id:'blanco',  name:'Cinturón Blanco',   emoji:'⬜',colorA:'#e2e8f0',colorB:'#94a3b8',desc:'El tablero',   minQ:10},
  {id:'amarillo',name:'Cinturón Amarillo', emoji:'🟡',colorA:'#fbbf24',colorB:'#d97706',desc:'Las piezas',   minQ:10},
  {id:'verde',   name:'Cinturón Verde',    emoji:'🟢',colorA:'#34d399',colorB:'#059669',desc:'Notación',     minQ:8},
  {id:'azul',    name:'Cinturón Azul',     emoji:'🔵',colorA:'#60a5fa',colorB:'#2563eb',desc:'Tácticas',     minQ:8},
  {id:'rojo',    name:'Cinturón Rojo',     emoji:'🔴',colorA:'#f87171',colorB:'#dc2626',desc:'Aperturas',    minQ:6},
  {id:'negro',   name:'Cinturón Negro',    emoji:'⬛',colorA:'#9ca3af',colorB:'#374151',desc:'¡Gran Maestro!',minQ:6},
];
const BELT_IDX={blanco:0,amarillo:1,verde:2,azul:3,rojo:4,negro:5};

// ═══════════════════════════════════════════════════════
//  DATA – QUESTIONS
// ═══════════════════════════════════════════════════════
// Types: mcq (multiple choice), click (tap square), yesno (sí/no on board)
// topic: used for adaptive weak-area tracking

const BLANCO_Q=[
  {id:'b01',type:'mcq',topic:'basico',em:'♟️',
   q:'¿Cuántas casillas tiene un tablero de ajedrez?',
   opts:['32','48','64','100'],ans:'64',
   fact:'¡El tablero tiene 8 columnas × 8 filas = 64 casillas!'},
  {id:'b02',type:'mcq',topic:'basico',em:'📐',
   q:'¿Cuántas filas (horizontales) tiene el tablero?',
   opts:['6','7','8','9'],ans:'8',
   fact:'Las filas se llaman RANGOS y se numeran del 1 al 8.'},
  {id:'b03',type:'mcq',topic:'basico',em:'📏',
   q:'¿Con qué se identifican las COLUMNAS del tablero?',
   opts:['Números 1-8','Letras a-h','Colores','Símbolos'],ans:'Letras a-h',
   fact:'Las columnas se llaman FILES y van de la a (izquierda del blanco) hasta la h (derecha).'},
  {id:'b04',type:'mcq',topic:'colores',em:'🎨',
   q:'¿De qué color es la casilla a1 (esquina abajo-izquierda del blanco)?',
   opts:['Clara (blanca)','Oscura (negra)','Puede ser cualquiera'],ans:'Oscura (negra)',
   fact:'¡La esquina a1 siempre es OSCURA! Coloca el tablero con una casilla oscura a tu izquierda.'},
  {id:'b05',type:'mcq',topic:'colores',em:'⬜',
   q:'¿De qué color es la casilla h1?',
   opts:['Clara (blanca)','Oscura (negra)'],ans:'Clara (blanca)',
   fact:'h1 es clara. Recuerda: las casillas de esquina opuesta al mismo color siempre son distintas.'},
  {id:'b06',type:'mcq',topic:'colores',em:'🔢',
   q:'¿Cuántas casillas CLARAS hay en el tablero?',
   opts:['16','24','32','40'],ans:'32',
   fact:'¡Exacto! 32 claras y 32 oscuras. El tablero está perfectamente dividido.'},
  {id:'b07',type:'mcq',topic:'notacion',em:'🗺️',
   q:'En ajedrez, ¿cómo se llama la casilla que está en la columna "e" y fila "4"?',
   opts:['4e','e-4','e4','e/4'],ans:'e4',
   fact:'Se escribe primero la LETRA (columna) y luego el NÚMERO (fila). Siempre: letra + número.'},
  {id:'b08',type:'mcq',topic:'notacion',em:'📍',
   q:'¿Qué indica "h8" en un tablero?',
   opts:['Columna h, fila 8','Fila h, columna 8','La casilla número 88','Un movimiento'],ans:'Columna h, fila 8',
   fact:'h8 es la esquina arriba-derecha (desde el lado blanco). ¡Es una casilla oscura!'},
  {id:'b09',type:'click',topic:'click_basico',em:'👆',
   q:'¡Toca la casilla e4!',target:'e4',
   fact:'e4 es una de las jugadas de apertura más populares del mundo.'},
  {id:'b10',type:'click',topic:'click_basico',em:'👆',
   q:'¡Toca la casilla a1!',target:'a1',
   fact:'a1 es la esquina inferior izquierda del jugador blanco. ¡Siempre es oscura!'},
  {id:'b11',type:'click',topic:'click_basico',em:'👆',
   q:'¡Toca la casilla h8!',target:'h8',
   fact:'h8 es la esquina superior derecha. ¡La casilla del rey negro al inicio está cerca, en e8!'},
  {id:'b12',type:'click',topic:'click_basico',em:'👆',
   q:'¡Toca la casilla d5!',target:'d5',
   fact:'d5 es el centro del tablero. Las casillas centrales son muy importantes en ajedrez.'},
  {id:'b13',type:'click',topic:'click_basico',em:'👆',
   q:'¡Toca la casilla c3!',target:'c3',
   fact:'c3 es una casilla donde suele ir el caballo blanco en muchas aperturas.'},
  {id:'b14',type:'click',topic:'click_basico',em:'👆',
   q:'¡Toca la casilla f6!',target:'f6',
   fact:'f6 es donde suele ir el caballo negro. ¡El caballo en f6 defiende el centro!'},
];

const AMARILLO_Q=[
  {id:'a01',type:'mcq',topic:'piezas_nombre',em:'♘',
   q:'¿Qué pieza se mueve en forma de "L" (2+1 casillas)?',
   opts:['El alfil','El caballo','La torre','El rey'],ans:'El caballo',
   fact:'¡El caballo es la única pieza que puede SALTAR sobre otras! Se mueve 2 casillas en una dirección y 1 en perpendicular.'},
  {id:'a02',type:'mcq',topic:'piezas_nombre',em:'♗',
   q:'¿Qué pieza se mueve SOLO en diagonal?',
   opts:['El rey','La torre','El alfil','El peón'],ans:'El alfil',

// Returns facts from all unlocked legends (for curiosidad del día)
function getUnlockedFacts(pid){
  const p=data[pid];
  if(!p)return[];
  const beltIdx=BELT_IDX[currentBelt(pid)]??0;
  let facts=[];
  LEGENDS.forEach((lg,i)=>{
    if(i<=beltIdx) facts.push(...lg.facts.map(f=>({fact:f,legend:lg.name,emoji:lg.emoji})));
  });
  return facts;
}

function currentBelt(pid){
  const p=data[pid];
  if(!p)return'blanco';
  for(let i=BELTS.length-1;i>=0;i--){
    const b=BELTS[i];
    if(p.belts[b.id]?.boss)return b.id;
  }
  return'blanco';
}

function getDailyCuriosidad(pid){
  const facts=getUnlockedFacts(pid);
  if(!facts.length)return null;
  const d=todayStr();
  const seed=d.split('-').reduce((a,b)=>a*13+parseInt(b),7);
  return facts[Math.abs(seed)%facts.length];
}

function todayStr(){return new Date().toISOString().slice(0,10);}

function getDailyQ(){
  // Deterministic pick based on date (same question for everyone each day)
  const allQs=Object.values(ALL_QS).flat().filter(q=>q.type==='mcq');
  const d=todayStr();
  const seed=d.split('-').reduce((a,b)=>a*31+parseInt(b),0);
  return allQs[Math.abs(seed)%allQs.length];
}

function isDailyDone(pid){
  return data[pid]?.daily?.date===todayStr()&&data[pid]?.daily?.done;
}

//  SVG CHESSBOARD
// ═══════════════════════════════════════════════════════
function boardSVG({size=300,highlight=null,piece=null,pieceAt=null,marker=null,pieces=[]}={}){
  const sq=size/8;
  let cells='', glowSq=null;
  // Build piece lookup by square
  const pieceMap={};
  if(piece&&pieceAt) pieceMap[pieceAt]={p:piece,glow:false};
  pieces.forEach(({p,sq:s,glow})=>{pieceMap[s]={p,glow};if(glow)glowSq=s;});

  for(let rank=8;rank>=1;rank--){
    for(let fi=0;fi<8;fi++){
      const col=String.fromCharCode(97+fi);
      const id=`${col}${rank}`;
      const x=fi*sq, y=(8-rank)*sq;
      const isLight=(fi+rank)%2===0;
      let fill=isLight?'#f0d9b5':'#b58863';
      if(highlight===id)fill='#aac244';
      if(marker===id)fill='#e06060';
      if(glowSq===id)fill=isLight?'#ffe066':'#d4a800'; // gold highlight for piece to move
      const lc=isLight?'#b58863':'#f0d9b5';
      cells+=`<rect x="${x}" y="${y}" width="${sq}" height="${sq}" fill="${fill}" data-sq="${id}" style="cursor:pointer"/>`;
      if(rank===1) cells+=`<text x="${x+sq-sq*0.18}" y="${y+sq-sq*0.06}" font-size="${sq*0.22}" fill="${lc}" pointer-events="none" text-anchor="end">${col}</text>`;
      if(fi===0)   cells+=`<text x="${x+sq*0.05}" y="${y+sq*0.28}" font-size="${sq*0.22}" fill="${lc}" pointer-events="none">${rank}</text>`;
    }
  }
  // Render pieces on top
  let pieceEls='';
  Object.entries(pieceMap).forEach(([sqId,{p,glow}])=>{
    const fi=sqId.charCodeAt(0)-97;
    const rank=parseInt(sqId[1]);
    const cx=fi*sq+sq/2, cy=(8-rank)*sq+sq/2;
    const extra=glow?` class="piece-glow"`:'';
    pieceEls+=`<text x="${cx}" y="${cy}" font-size="${sq*0.72}" text-anchor="middle" dominant-baseline="central" pointer-events="none" filter="drop-shadow(0 2px 4px rgba(0,0,0,.7))"${extra}>${p}</text>`;
  });
  return `<svg id="chessboard" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block">${cells}${pieceEls}</svg>`;
}

function attachBoardClick(target,onSq){
  const svg=document.getElementById('chessboard');
  if(!svg)return;
  svg.querySelectorAll('rect[data-sq]').forEach(r=>{
    r.onclick=()=>onSq(r.dataset.sq);
  });
}

function startBelt(beltId){
  gs.belt=beltId;
  const pb=PB();
  const qs=ALL_QS[beltId];

  // boss mode if all done or already done? Check if can boss
  const doneCount=Object.keys(pb.done).length;
  const minQ=BELTS[BELT_IDX[beltId]].minQ;
  if(doneCount>=minQ&&!pb.boss){
    // Show boss prompt
    showBossPrompt();
    return;
  }

  gs.mode='learn';
  // Build smart pool: weak first, then unseen, then all
  const weakIds=Object.keys(pb.weak).filter(id=>pb.weak[id]>0);
  const unseenIds=qs.filter(q=>!pb.done[q.id]&&!pb.weak[q.id]).map(q=>q.id);
  const seenIds=qs.filter(q=>pb.done[q.id]&&!pb.weak[q.id]).map(q=>q.id);
  // deduplicate: weak first, then unseen, then seen (no overlaps)
  const seen=new Set([...weakIds,...unseenIds]);
  const pool_ordered=[...weakIds,...unseenIds,...seenIds.filter(id=>!seen.has(id))];
  let pool=shuffle(pool_ordered);
  // limit to 8
  pool=pool.slice(0,8);
  gs.qs=pool.map(id=>qs.find(q=>q.id===id)).filter(Boolean);
  gs.qi=0;gs.score=0;gs.wrong=[];gs.streak=0;
  gs.waitNext=false;
  showQuestion();
}

function showQuestion(){
  if(gs.qi>=gs.qs.length){endSession();return;}

  const belt=BELTS[BELT_IDX[gs.belt]];
  const prog=`${gs.qi+1}/${gs.qs.length}`;
  const bossBanner=gs.mode==='boss'?`<div class="boss-banner" style="padding:8px 12px"><h3>⚔️ Batalla - ${prog}</h3><p>Necesitas 4/5 para ganar el cinturón</p></div>`:'';
  const topProg=gs.mode!=='boss'?`<div class="lesson-prog">${prog} · 🔥${gs.streak} · 🪙${gs.score}</div>`:'';

  let body='';
  if(q.type==='mcq'){
    body=renderMCQ(q);
  } else if(q.type==='click'){
    body=renderClick(q);

    body=renderMate1(q);
  } else if(q.type==='yesno'){
    body=renderYesNo(q);

  render(`

  <button class="btn-sm btn-card" onclick="showHome()">← Inicio</button>

function boardSize(){
  return Math.min(300,window.innerWidth-48);
}

function renderMCQ(q){
  const shuffledOpts=shuffle([...q.opts]);
  const boardHTML=q.pieces?`<div class="board-wrap"><div class="board-svg-wrap">${boardSVG({size:boardSize(),pieces:q.pieces})}</div></div>`:'';

function renderYesNo(q){

  const pieceMap={rey:'♔',dama:'♕',torre:'♖',alfil:'♗',caballo:'♘',peon:'♙'};

// ═══════════════════════════════════════════════════════
//  ANSWER HANDLERS
// ═══════════════════════════════════════════════════════
function handleMCQ(btn,sel,ans,fact,idx){
  if(gs.waitNext)return;
  gs.waitNext=true;
  const correct=sel===ans;
  // disable all
  document.querySelectorAll('.opt-btn').forEach((b,i)=>{
    b.disabled=true;
    if(b.textContent===ans)b.classList.add('reveal-correct');
  });
  btn.classList.remove('reveal-correct');
  btn.classList.add(correct?'sel-correct':'sel-wrong');
  beep(correct);
  recordAnswer(correct);
  if(fact){
    const fb=document.getElementById('factbox');
    if(fb){fb.style.display='';fb.textContent=fact;}
  }
  const nw=document.getElementById('nextwrap');
  if(nw)nw.style.display='';
}

function handleClickAnswer(sq,q){
  if(gs.waitNext)return;
  const target=q.ans||q.target;
  const correct=sq===target;
  gs.waitNext=true;
  const sz=boardSize();
  const wrap=document.querySelector('.board-svg-wrap');
  if(wrap){
    const pcs=q.pieces||[];
    if(q.type==='mate1'){
      // Show pieces in final position (move the glowing piece to destination)
      const moved=pcs.map(item=>item.glow?{p:item.p,sq:target,glow:false}:item);
      if(correct) wrap.innerHTML=boardSVG({size:sz,pieces:moved,highlight:target});
      else{
        wrap.innerHTML=boardSVG({size:sz,pieces:pcs,highlight:target,marker:sq});
        wrap.classList.add('anim-shake');
      }
    } else {
      if(correct) wrap.innerHTML=boardSVG({size:sz,highlight:sq});
      else{
        wrap.innerHTML=boardSVG({size:sz,highlight:target,marker:sq});
        wrap.classList.add('anim-shake');
      }
    }
  }
  beep(correct);
  const feed=document.getElementById('bfeed');
  if(feed){feed.textContent=correct?'✅ ¡Correcto! ¡Jaque Mate!':'❌ Esa no era. La casilla correcta está en verde.';feed.className='board-feedback '+(correct?'ok':'bad');}
  if(q.type!=='mate1'&&!correct){const f2=document.getElementById('bfeed');if(f2)f2.textContent='❌ Esa no era. La correcta está marcada en verde.';}
  recordAnswer(correct);
  if(q.fact){
    const fb=document.getElementById('factbox');
    if(fb){fb.style.display='';fb.textContent=q.fact;}
  }
  const nw=document.getElementById('nextwrap');
  if(nw)nw.style.display='';
}

function handleYN(btn,sel,ans,fact){
  if(gs.waitNext)return;
  gs.waitNext=true;
  const correct=sel===ans;
  document.querySelectorAll('.yn-btn').forEach(b=>b.disabled=true);
  btn.style.background=correct?'#1a3a21':'#3a1a1a';
  btn.style.color=correct?'var(--correct)':'var(--wrong)';
  beep(correct);
  recordAnswer(correct);
  if(fact){
    const fb=document.getElementById('factbox');
    if(fb){fb.style.display='';fb.textContent=fact;}
  }
  const nw=document.getElementById('nextwrap');
  if(nw)nw.style.display='';
}

function recordAnswer(correct){
  const q=gs.qs[gs.qi];
  const p=P(); const pb=PB();
  if(correct){
    gs.score++;
    gs.streak++;
    if(gs.streak>p.maxStreak){p.maxStreak=gs.streak;}
    if(pb.weak[q.id]>0)pb.weak[q.id]=Math.max(0,(pb.weak[q.id]||0)-1);
    pb.done[q.id]=(pb.done[q.id]||0)+1;
    p.coins+=2;
  } else {
    gs.streak=0;
    gs.wrong.push(q.id);
    pb.weak[q.id]=(pb.weak[q.id]||0)+1;
  }
  p.streak=gs.streak;
  saveData();
}

function nextQ(){
  gs.qi++;
  gs.waitNext=false;
  showQuestion();
}

function pinKey(k){
  if(k==='⌫'){gs.pinBuffer=gs.pinBuffer.slice(0,-1);}
  else if(gs.pinBuffer.length<4&&k!==''){gs.pinBuffer+=k;}
  if(gs.pinBuffer.length===4){
    checkPin();
    return;
  }
  // update dots
  document.querySelectorAll('.pin-dot').forEach((d,i)=>d.classList.toggle('filled',gs.pinBuffer.length>i));
}

function checkPin(){
  const stored=localStorage.getItem(PIN_KEY);
  if(!stored){
    // First time: set PIN
    if(gs.pinBuffer.length===4){
      localStorage.setItem(PIN_KEY,gs.pinBuffer);
      showParent();
    }
  } else if(gs.pinBuffer===stored){
    showParent();
  } else {
    const msg=document.getElementById('pinmsg');
    if(msg)msg.textContent='PIN incorrecto. Inténtalo de nuevo.';
    gs.pinBuffer='';
    document.querySelectorAll('.pin-dot').forEach(d=>d.classList.remove('filled'));
  }
}

function showParent(){
  const {p1,p2}=data;
  function playerSection(pid,p){
    const weakTopics={};
    BELTS.forEach(b=>{
      const pb=p.belts[b.id];

        if(cnt>0){
          const q=ALL_QS[b.id]?.find(x=>x.id===qid);

            weakTopics[k]=(weakTopics[k]||0)+cnt;

    const weakArr=Object.entries(weakTopics).sort((a,b)=>b[1]-a[1]).slice(0,5);

      <div style="font-size:.85rem;color:var(--muted);margin-bottom:8px">🪙 ${p.coins} monedas · 🔥 Racha máx: ${p.maxStreak}</div>

function handleDailyMCQ(btn,sel,ans,fact){
  if(btn.disabled)return;
  document.querySelectorAll('.opt-btn').forEach(b=>{b.disabled=true;if(b.textContent===ans)b.classList.add('reveal-correct');});
  const correct=sel===ans;
  btn.classList.remove('reveal-correct');
  btn.classList.add(correct?'sel-correct':'sel-wrong');
  beep(correct);
  if(fact){const fb=document.getElementById('factbox');if(fb){fb.style.display='';fb.textContent=fact;}}
  const nw=document.getElementById('nextwrap');
  if(nw){
    nw.style.display='';
    nw.querySelector('button').onclick=()=>endDaily(correct);
  }
}

    if(svg)svg.querySelectorAll('rect[data-sq]').forEach(r=>{
      r.onclick=()=>handleDuelClick(r.dataset.sq,q);

function handleDuelMCQ(btn,sel,ans){
  if(btn.disabled)return;
  document.querySelectorAll('.opt-btn').forEach(b=>{b.disabled=true;if(b.textContent===ans)b.classList.add('reveal-correct');});
  const correct=sel===ans;
  btn.classList.remove('reveal-correct');
  btn.classList.add(correct?'sel-correct':'sel-wrong');
  beep(correct);
  if(correct)duel.scores[duel.turn]++;
  const nxt=document.getElementById('duel-next');if(nxt)nxt.style.display='';
}

function handleDuelClick(sq,q){
  const target=q.ans||q.target;
  const correct=sq===target;
  beep(correct);
  if(correct)duel.scores[duel.turn]++;
  const feed=document.getElementById('bfeed');
  if(feed){feed.textContent=correct?'✅ ¡Correcto!':'❌ Incorrecto';feed.className='board-feedback '+(correct?'ok':'bad');}
  const nxt=document.getElementById('duel-next');if(nxt)nxt.style.display='';
  // re-attach nothing (just show next btn)
  const svg=document.getElementById('chessboard');
  if(svg)svg.querySelectorAll('rect[data-sq]').forEach(r=>r.onclick=null);
}

function handleDuelYN(btn,sel,ans){
  if(btn.disabled)return;
  document.querySelectorAll('.yn-btn').forEach(b=>b.disabled=true);
  const correct=sel===ans;
  btn.style.background=correct?'#1a3a21':'#3a1a1a';
  btn.style.color=correct?'var(--correct)':'var(--wrong)';
  beep(correct);
  if(correct)duel.scores[duel.turn]++;
  const nxt=document.getElementById('duel-next');if(nxt)nxt.style.display='';
}

function duelNext(){
  // Switch turns or advance question
  if(duel.turn==='p1'){
    duel.turn='p2';
    showDuelQuestion(); // same question, other player
  } else {
    duel.turn='p1';
    duel.qi++;
    showDuelQuestion(); // next question
  }
}

function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}
  return b;
}
function escQ(s){return (s||'').replace(/'/g,'&#39;').replace(/"/g,'&quot;');}

function beep(correct){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.type=correct?'sine':'square';
    osc.frequency.value=correct?880:200;
    gain.gain.value=0.18;
    osc.start();
    if(correct){
      osc.frequency.setValueAtTime(880,ctx.currentTime);
      osc.frequency.setValueAtTime(1100,ctx.currentTime+0.12);
    }
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+(correct?0.3:0.25));
    osc.stop(ctx.currentTime+(correct?0.3:0.25));
  }catch(e){}
}

function fanfare(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const notes=[523,659,784,1047];
    notes.forEach((freq,i)=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.type='sine';osc.frequency.value=freq;
      gain.gain.value=0.18;
      const t=ctx.currentTime+i*0.13;
      osc.start(t);
      gain.gain.setValueAtTime(0.18,t);
      gain.gain.exponentialRampToValueAtTime(0.001,t+0.35);
      osc.stop(t+0.35);
    });
  }catch(e){}
}

function confetti(){
  const colors=['#ffd700','#7c3aed','#a78bfa','#3fb950','#60a5fa','#f85149','#fb923c'];
  for(let i=0;i<70;i++){
    const el=document.createElement('div');
    const size=6+Math.random()*8;
    el.style.cssText=`
      position:fixed;width:${size}px;height:${size}px;border-radius:${Math.random()>0.5?'50%':'2px'};
      background:${colors[i%colors.length]};
      left:${Math.random()*100}%;top:-12px;
      animation:fall ${1.2+Math.random()*1.8}s ease-in forwards;
      animation-delay:${Math.random()*0.8}s;
      transform:rotate(${Math.random()*360}deg);
      pointer-events:none;z-index:9999;opacity:1`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),3500);
  }
}
