<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4F46E5"><meta name="robots" content="noindex">
<title>Cycle Test Quest 🦉</title>
<style>:root{--in:#4F46E5;--il:#EEF2FF;--te:#0D9488;--tl:#CCFBF1;--pu:#7C3AED;--pk:#EC4899;--or:#F97316;--ye:#FACC15;--gr:#16A34A;--gl:#DCFCE7;--re:#DC2626;--rl:#FEE2E2;--bg:#F5F7FF;--tx:#1E293B;--mu:#64748B;--r:20px;--sh:0 6px 22px rgba(79,70,229,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:ui-rounded,'SF Pro Rounded','Nunito','Trebuchet MS',system-ui,sans-serif;font-size:16px}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:90px}
button{font-family:inherit;cursor:pointer;border:0}
.hero{background:linear-gradient(135deg,#4F46E5 0%,#7C3AED 55%,#EC4899 100%);color:#fff;padding:34px 20px 46px;text-align:center;border-radius:0 0 34px 34px;box-shadow:var(--sh)}
.hero .em{font-size:60px;animation:bob 2.4s ease-in-out infinite}
.hero h1{margin:6px 0 2px;font-size:30px;letter-spacing:.5px}
.hero p{margin:0;opacity:.92;font-weight:600}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.pad{padding:16px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:-26px;padding:0 16px}
.kid{background:#fff;border-radius:var(--r);padding:18px 10px;text-align:center;box-shadow:var(--sh);border:3px solid transparent;font-weight:800;transition:.15s}
.kid:active{transform:scale(.96)}
.kid.k1{border-color:#C7D2FE}.kid.k2{border-color:#FBCFE8}
.kid .av{font-size:54px}.kid .nm{font-size:19px;margin-top:4px}.kid .sub{font-size:13px;color:var(--mu);font-weight:700;margin-top:4px}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.06);position:sticky;top:0;z-index:5}
.top .back{background:var(--il);color:var(--in);border-radius:12px;padding:8px 12px;font-weight:800;font-size:16px}
.top .ttl{flex:1;font-weight:900;font-size:17px;line-height:1.15}
.chip{background:var(--il);color:var(--in);border-radius:99px;padding:6px 11px;font-weight:900;font-size:14px;white-space:nowrap}
.chip.y{background:#FEF9C3;color:#A16207}.chip.o{background:#FFEDD5;color:#C2410C}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin:14px 16px}
.card h2{margin:0 0 8px;font-size:18px}
.profile{display:flex;align-items:center;gap:12px}
.profile .av{font-size:44px}.profile .info{flex:1}
.profile .nm{font-weight:900;font-size:20px}
.bar{height:12px;background:#E2E8F0;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#4F46E5,#EC4899);border-radius:99px;transition:width .5s}
.small{font-size:13px;color:var(--mu);font-weight:700}
.test-card{background:linear-gradient(135deg,#0D9488,#4F46E5);color:#fff}
.test-card .big{font-size:30px;font-weight:900}
.cd{display:inline-block;background:#fff;color:var(--in);border-radius:99px;padding:5px 14px;font-weight:900;margin-top:6px}
.task{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--bg);margin-top:8px;font-weight:800;border:2px solid transparent}
.task.done{background:var(--gl);border-color:#86EFAC}
.task .ck{width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid #CBD5E1;display:grid;place-items:center;font-size:15px}
.task.done .ck{background:var(--gr);border-color:var(--gr);color:#fff}
.btn{display:block;width:100%;padding:15px;border-radius:16px;font-weight:900;font-size:17px;color:#fff;background:var(--in);box-shadow:0 5px 0 #3730A3;margin-top:12px;transition:.1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #3730A3}
.btn.g{background:var(--gr);box-shadow:0 5px 0 #166534}.btn.g:active{box-shadow:0 1px 0 #166534}
.btn.o{background:var(--or);box-shadow:0 5px 0 #C2410C}.btn.o:active{box-shadow:0 1px 0 #C2410C}
.btn.p{background:var(--pk);box-shadow:0 5px 0 #BE185D}.btn.p:active{box-shadow:0 1px 0 #BE185D}
.btn.ghost{background:#fff;color:var(--in);box-shadow:inset 0 0 0 3px #C7D2FE}
.btn.sm{padding:10px;font-size:15px;box-shadow:none}
.btn:disabled{opacity:.45;box-shadow:none;transform:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.mod{background:#fff;border-radius:var(--r);padding:14px 12px;box-shadow:var(--sh);text-align:left;border-top:6px solid var(--c,#4F46E5);position:relative}
.mod:active{transform:scale(.97)}
.mod .e{font-size:30px}.mod .n{font-weight:900;font-size:15px;line-height:1.15;margin:4px 0 8px;min-height:35px}
.mini{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--mu);margin-top:4px}
.mini .bar{flex:1;height:8px}
.crown{position:absolute;top:8px;right:10px;font-size:22px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:#fff;display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,.08);z-index:9;border-radius:22px 22px 0 0}
.nav button{background:none;font-weight:800;font-size:12px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 10px}
.nav button b{font-size:22px}
.nav button.on{color:var(--in)}
.learn{font-size:17px;line-height:1.55}
.learn h3{margin-top:0;color:var(--in)}
.learn p{margin:10px 0;background:var(--il);padding:10px 12px;border-radius:14px}
.prog{display:flex;gap:10px;align-items:center;padding:12px 16px;background:#fff}
.prog .bar{flex:1}
.q{margin:14px 16px;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.q .lbl{font-size:13px;font-weight:900;color:var(--in);letter-spacing:.5px;margin-bottom:6px}
.q .qt{font-size:20px;font-weight:800;line-height:1.35;white-space:pre-line}
.q .hint{margin-top:10px;background:#FEF9C3;color:#854D0E;padding:8px 12px;border-radius:12px;font-weight:700;font-size:14px}
.text{background:#FFFBEB;border-left:6px solid #F59E0B;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:16px;line-height:1.6}
.text b.t{display:block;margin-bottom:4px;color:#92400E}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{background:#fff;border:3px solid #E2E8F0;border-radius:16px;padding:13px 14px;font-size:17px;font-weight:800;text-align:left;color:var(--tx);transition:.1s}
.opt:active{transform:scale(.98)}
.opt.ok{background:var(--gl);border-color:var(--gr)}
.opt.no{background:var(--rl);border-color:var(--re)}
.inp{width:100%;font-size:21px;font-family:inherit;font-weight:800;padding:14px;border-radius:16px;border:3px solid #C7D2FE;outline:none;margin-top:14px;color:var(--tx);background:#fff}
.inp:focus{border-color:var(--in)}
.inp.ok{border-color:var(--gr);background:var(--gl)}.inp.no{border-color:var(--re);background:var(--rl)}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.keys button{background:var(--il);color:var(--in);font-weight:900;font-size:18px;border-radius:10px;padding:7px 11px;min-width:40px}
.speak{display:flex;gap:10px;margin-top:12px}
.speak button{flex:1;background:var(--tl);color:#0F766E;font-weight:900;font-size:16px;padding:13px;border-radius:14px}
.chipbox{min-height:58px;border:3px dashed #C7D2FE;border-radius:16px;padding:8px;margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#FAFAFF}
.chipbox.empty:before{content:'Toca las palabras aquí…';color:#94A3B8;font-weight:700}
.chipbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tk{background:var(--in);color:#fff;font-weight:900;font-size:18px;border-radius:14px;padding:10px 14px;box-shadow:0 4px 0 #3730A3}
.tk.used{opacity:.25;box-shadow:none}
.tk.in{background:var(--te);box-shadow:0 4px 0 #115E59}
.fb{margin:0 16px 16px;border-radius:var(--r);padding:16px;font-weight:800;animation:pop .25s}
.fb.ok{background:var(--gl);border:3px solid var(--gr);color:#14532D}
.fb.no{background:var(--rl);border:3px solid var(--re);color:#7F1D1D}
.fb .big{font-size:19px;margin-bottom:4px}
.fb .ex{font-weight:700;font-size:15px;margin-top:4px}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.res{text-align:center;padding:24px 16px}
.res .stars{font-size:54px;letter-spacing:6px}
.res .big{font-size:44px;font-weight:900;color:var(--in)}
.pts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.miss{text-align:left;background:#fff;border-radius:16px;padding:12px 14px;margin-top:8px;box-shadow:var(--sh);font-weight:700;font-size:15px}
.miss b{color:var(--gr)}
.prize{background:#fff;border-radius:var(--r);padding:14px 10px;text-align:center;box-shadow:var(--sh);font-weight:800}
.prize .e{font-size:40px}.prize .n{font-size:14px;min-height:36px;margin:4px 0}
.prize button{width:100%;margin-top:6px}
.badge{background:#fff;border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--sh);font-weight:800;font-size:12px}
.badge .e{font-size:34px}.badge.lock{opacity:.35;filter:grayscale(1)}
.cal{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:#fff;margin:10px 16px;box-shadow:var(--sh);border-left:6px solid var(--c,#94A3B8)}
.cal .dt{min-width:58px;text-align:center;font-weight:900;line-height:1.1}
.cal .dt b{display:block;font-size:24px}
.cal.past{opacity:.5}
.cal .info{flex:1;font-weight:800}
.cal .tp{font-size:12px;color:var(--mu);font-weight:700;margin-top:3px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:900}
.tag.g{background:var(--gl);color:#166534}.tag.y{background:#FEF9C3;color:#854D0E}
.mh{margin:18px 16px 0;font-weight:900;color:var(--mu);letter-spacing:1px;font-size:13px;text-transform:uppercase}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#1E293B;color:#fff;padding:12px 18px;border-radius:16px;font-weight:800;z-index:99;max-width:90%;text-align:center;animation:pop .25s;box-shadow:var(--sh)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.6);display:grid;place-items:center;z-index:50;padding:20px}
.modal .box{background:#fff;border-radius:24px;padding:22px;max-width:420px;width:100%;text-align:center;animation:pop .25s;max-height:90vh;overflow:auto}
.modal .e{font-size:64px}
.confetti{position:fixed;top:-30px;font-size:28px;z-index:80;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
.field{width:100%;padding:11px;font-size:16px;font-family:inherit;border:2px solid #CBD5E1;border-radius:12px;margin-top:6px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row .field{margin-top:0}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-weight:700}
.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid #E2E8F0;text-align:left}
.tabs{display:flex;gap:8px;padding:12px 16px 0}
.tabs button{flex:1;background:#fff;border-radius:12px;padding:10px;font-weight:900;color:var(--mu);box-shadow:var(--sh)}
.tabs button.on{background:var(--in);color:#fff}
.lock{background:none;color:var(--mu);font-weight:800;text-decoration:underline;display:block;margin:20px auto}
.owl{font-size:46px}
</style></head>
<body><div id="app"></div>
<script>
/* ═══════════════════════════════════════════════
   CONTENIDO — 1er Cycle Test de LENGUA (6 oct 2026)
   Módulos: mayúscula, orden alfabético, sonido K,
   sinónimos y antónimos, gramática, comprensión lectora
═══════════════════════════════════════════════ */
const mc=(q,ans,wrong,expl)=>({t:'mc',q,ans,opts:[ans,...wrong],expl:expl||''});
const tx=(q,ans,mode,extra)=>Object.assign({t:'tx',q,ans:Array.isArray(ans)?ans:[ans],mode:mode||'loose'},extra||{});
const chips=(q,tokens,ans,expl)=>({t:'chips',q,tokens,ans:Array.isArray(ans)?ans:[ans],expl:expl||''});

/* ---------- banco de palabras para ordenar alfabéticamente ---------- */
const ALPHA_GROUPS={ // palabras que empiezan igual (nivel difícil)
  c:['caballo','camisa','casa','cama','cuna','cola','coche','cebra','cuento'],
  m:['mesa','mariposa','manzana','mano','mono','mapa','moto','mar','menta'],
  p:['pan','pera','playa','pájaro','pato','perro','pelota','puerta','piña'],
  s:['sol','silla','sapo','sopa','sal','seta','sillón','suelo'],
  l:['luna','libro','león','lápiz','lazo','lobo','lupa','leche','lana'],
  r:['rana','ratón','rosa','rojo','regla','reloj','rayo','ropa'],
  t:['tren','tigre','tortuga','taza','techo','tomate','toro','tela'],
  b:['barco','bota','banco','boca','bolso','bruja','bici','bosque'],
};
const ALPHA_DISTINCT=['abeja','árbol','barco','caballo','dado','escuela','flor','gato','helado','isla','jirafa','kiwi','luna','mesa','nube','ñu','oso','pera','queso','rana','sol','tren','uva','vaca','xilófono','yogur','zapato','zorro','delfín','fresa','globo','hormiga','naranja','ojo','silla','zanahoria'];

const LEN1={
  id:'len1', subject:'Lengua', ct:'1er Cycle Test', date:'2026-10-06',
  modules:[
/* ═════════════ 1. LA MAYÚSCULA ═════════════ */
  { id:'mayus', nm:'La mayúscula', em:'🔠', color:'#7C3AED',
    learn:`<h3>¿Cuándo se escribe con MAYÚSCULA?</h3>
<p>✅ <b>Al empezar a escribir</b> una frase: <i>Hoy hace sol.</i></p>
<p>✅ <b>Después de un punto</b>: <i>Es lunes. Vamos al cole.</i></p>
<p>✅ <b>Nombres propios</b> de personas y mascotas: <i>Lucía, Pablo, mi perro Max</i></p>
<p>✅ <b>Lugares</b>: ciudades, países, ríos, montañas… <i>Madrid, España, río Tajo, Teide</i></p>
<p>✅ <b>Nombres de colegios y calles</b>: <i>colegio San Patricio</i></p>
<p>❌ <b>¡Ojo, trampa!</b> Los <b>días</b> (lunes, martes…), los <b>meses</b> (octubre…) y las <b>estaciones</b> (otoño…) se escriben con <b>minúscula</b>.</p>
<p>🧠 Truco: si es el <b>nombre único</b> de alguien o de algún sitio, ¡mayúscula!</p>`,
    test:[
      mc('¿Cuál oración está bien escrita?','Mi amiga se llama Lucía.',['Mi amiga se llama lucía.','mi amiga se llama Lucía.','Mi Amiga se llama Lucía.'],'Empieza con mayúscula y Lucía es un nombre propio.'),
      mc('¿Cuál de estas palabras necesita mayúscula?','madrid',['mesa','libro','casa'],'Madrid es el nombre de una ciudad: nombre propio.'),
      mc('Después de un punto, la siguiente palabra se escribe con…','mayúscula',['minúscula','comillas','acento'],'Después de punto siempre mayúscula.'),
      mc('¿Cuál es un nombre propio?','Pablo',['niño','perro','ciudad'],'Pablo es el nombre de una persona concreta.'),
      mc('¿Cuál oración está bien escrita?','Hoy es lunes.',['Hoy es Lunes.','hoy es lunes.','Hoy Es lunes.'],'Los días de la semana van con minúscula (aunque a principio de frase sí llevan mayúscula).'),
      mc('¿Cuál oración está bien escrita?','Mi cumpleaños es en octubre.',['Mi cumpleaños es en Octubre.','mi cumpleaños es en octubre.','Mi cumpleaños es en Octubre'],'Los meses se escriben con minúscula.'),
      mc('¿Cuál oración está bien escrita?','Mi perro se llama Toby.',['Mi perro se llama toby.','mi perro se llama Toby.','Mi Perro se llama Toby.'],'Los nombres de mascotas también son nombres propios.'),
      mc('¿Cuál oración está bien escrita?','Vivo en España.',['Vivo en españa.','vivo en España.','Vivo En España.'],'España es un país: mayúscula.'),
      mc('¿Cuántas mayúsculas necesita: «ayer fui con pedro a barcelona.»?','3',['1','2','4'],'Ayer (empieza), Pedro (persona) y Barcelona (ciudad).'),
      mc('¿Cuál oración está bien escrita?','El río Tajo pasa por Toledo.',['El Río Tajo pasa por Toledo.','el río tajo pasa por toledo.','El río tajo pasa por Toledo.'],'Tajo y Toledo son nombres propios; «río» no.'),
      mc('¿Cuál oración está bien escrita?','Estudio en el colegio San Patricio.',['Estudio en el colegio san patricio.','estudio en el Colegio San Patricio.','Estudio en el colegio San patricio.'],'San Patricio es el nombre del colegio: las dos palabras con mayúscula.'),
      mc('¿Por qué «Sofía» lleva mayúscula?','Porque es un nombre propio',['Porque es muy larga','Porque lleva tilde','Porque es la última palabra'],''),
      mc('¿Cuál de estas palabras se escribe con minúscula en medio de una frase?','jueves',['Guadalajara','Ana','España'],'Los días de la semana van con minúscula.'),
      mc('¿Cuál oración está bien escrita?','Mis primos Juan y Ana viven en Sevilla.',['Mis primos juan y ana viven en sevilla.','Mis Primos Juan y Ana viven en Sevilla.','Mis primos Juan y ana viven en Sevilla.'],''),
      mc('¿Cuál oración está bien escrita?','El sábado voy al cine.',['el sábado voy al cine.','El Sábado voy al cine.','el Sábado voy al cine.'],'Empieza con mayúscula; «sábado» en medio sería minúscula, pero aquí «El» abre la frase.'),
      mc('¿Cuál oración está bien escrita?','Mi hermano se llama Álvaro y su gata se llama Luna.',['Mi hermano se llama álvaro y su gata se llama luna.','Mi hermano se llama Álvaro y su gata se llama luna.','mi hermano se llama Álvaro y su gata se llama Luna.'],'Álvaro y Luna: nombres propios. ¡Las mayúsculas también llevan tilde!'),
      mc('¿Qué palabra de esta lista es el nombre de un río?','Ebro',['mesa','verano','lunes'],'Ebro es el nombre de un río: nombre propio.'),
    ],
    write:[
      tx('✍️ Escribe bien, con sus mayúsculas:\nayer fui al parque con maría.','Ayer fui al parque con María.','caps',{hint:'Son 3 mayúsculas.'}),
      tx('✍️ Escribe bien, con sus mayúsculas:\nmi perro se llama max.','Mi perro se llama Max.','caps',{hint:'Son 2 mayúsculas.'}),
      tx('✍️ Escribe bien, con sus mayúsculas:\nvivo en madrid y mi abuela vive en toledo.','Vivo en Madrid y mi abuela vive en Toledo.','caps',{hint:'Son 3 mayúsculas.'}),
      tx('✍️ Escribe bien, con sus mayúsculas:\nel lunes iremos a la playa.','El lunes iremos a la playa.','caps',{hint:'¡Cuidado! ¿Lleva mayúscula «lunes»?'}),
      tx('✍️ Escribe bien, con sus mayúsculas:\nmi colegio se llama san patricio.','Mi colegio se llama San Patricio.','caps',{hint:'Son 3 mayúsculas.'}),
      tx('✍️ Escribe bien, con sus mayúsculas:\npablo y lucas son hermanos. juegan al fútbol.','Pablo y Lucas son hermanos. Juegan al fútbol.','caps',{hint:'Son 4 mayúsculas.'}),
      tx('✍️ Escribe bien, con sus mayúsculas:\nel río ebro pasa por zaragoza.','El río Ebro pasa por Zaragoza.','caps',{hint:'Son 3 mayúsculas.'}),
      tx('✍️ Escribe bien, con sus mayúsculas:\nen octubre empieza el otoño.','En octubre empieza el otoño.','caps',{hint:'Solo 1 mayúscula. Los meses y las estaciones van en minúscula.'}),
      tx('✍️ Escribe bien, con sus mayúsculas:\nmi gata luna duerme en el sofá.','Mi gata Luna duerme en el sofá.','caps',{hint:'Son 2 mayúsculas.'}),
      tx('✍️ Escribe bien, con sus mayúsculas:\nespaña está en europa.','España está en Europa.','caps',{hint:'Son 2 mayúsculas.'}),
      tx('✍️ Escribe bien, con sus mayúsculas:\nhoy es martes. mañana es miércoles.','Hoy es martes. Mañana es miércoles.','caps',{hint:'Son 2 mayúsculas.'}),
      tx('✍️ Escribe bien, con sus mayúsculas:\nmi tía carmen vive en sevilla.','Mi tía Carmen vive en Sevilla.','caps',{hint:'Son 3 mayúsculas.'}),
      tx('✍️ Escribe bien, con sus mayúsculas:\n¿cómo te llamas? me llamo daniel.','¿Cómo te llamas? Me llamo Daniel.','caps',{hint:'Son 3 mayúsculas.'}),

function parseD(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function todayD(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function dayKey(d){d=d||todayD();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function daysUntil(s,from){return Math.round((parseD(s)-(from||todayD()))/864e5);}
function fmtDate(s){const d=parseD(s);return DIAS[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()];}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ═══════════ CORRECCIÓN DE RESPUESTAS ESCRITAS ═══════════ */
// quita tildes pero conserva la ñ (la ñ SÍ importa)
function stripAcc(s){return s.replace(/ñ/g,'\u0001').replace(/Ñ/g,'\u0002').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\u0001/g,'ñ').replace(/\u0002/g,'Ñ');}
function nl(s){return stripAcc(String(s).toLowerCase()).replace(/[¿?¡!.,;:"“”«»()\-–]/g,' ').replace(/\s+/g,' ').trim();}
function capsCanon(s,keepAcc){let t=String(s).replace(/[¿¡]/g,'').replace(/\s+/g,' ').trim().replace(/[.!?]+$/,'').trim();return keepAcc?t:stripAcc(t);}
function checkTx(q,raw){
  const user=String(raw||'').trim();
  if(!user) return {ok:false,empty:true};
  const mode=q.mode||'loose';
  if(mode==='caps'){
    for(const a of q.ans){
      if(capsCanon(user)===capsCanon(a)){
        const exact=capsCanon(user,true)===capsCanon(a,true);
        return {ok:true,note:exact?'':'¡Bien! Pero ojo con las tildes: se escribe «'+a+'».'};
      }
    }
    return {ok:false};
  }
  if(mode==='list'){
    const u=nl(user).split(/[\s,;]+/).filter(Boolean);
    for(const a of q.ans){const t=nl(a).split(/[\s,;]+/).filter(Boolean);if(t.length===u.length&&t.every((x,i)=>x===u[i]))return {ok:true};}
    return {ok:false};
  }
  if(mode==='keys'){
    const u=' '+nl(user)+' ';
    if(u.trim().length<3) return {ok:false};
    const ok=q.keys.every(g=>g.some(k=>u.includes(nl(k))));
    return {ok};
  }
  // loose
  const u=nl(user);
  return {ok:q.ans.some(a=>nl(a)===u)};
}
function selfCorrectable(q){return q.t==='tx'&&(q.mode==='loose'||q.mode==='keys');}

/* ═══════════ GENERADOR: ordenar alfabéticamente ═══════════ */
const esCmp=(a,b)=>a.localeCompare(b,'es');
function genAlphaWords(level){
  for(let tries=0;tries<50;tries++){
    let words;
    if(level===1){
      const seen=new Set();words=[];
      for(const w of shuffle(ALPHA_DISTINCT)){const f=nl(w)[0];if(!seen.has(f)){seen.add(f);words.push(w);}if(words.length===(Math.random()<.5?4:5))break;}
    } else {
      const g=rnd(Object.keys(ALPHA_GROUPS));
      words=shuffle(ALPHA_GROUPS[g]).slice(0,4);
    }
    const sorted=[...words].sort(esCmp);
    if(words.join()!==sorted.join()) return {words,sorted};
  }
  const w=['gato','abeja','perro','nube'];return {words:w,sorted:[...w].sort(esCmp)};
}
function genAlphaChips(level){
  const {words,sorted}=genAlphaWords(level);
  return {t:'chips',q:level===1?'Toca las palabras en ORDEN ALFABÉTICO (de la A a la Z):':'Todas empiezan igual: mira la 2ª y la 3ª letra. ¡Ordénalas!',tokens:words,ans:[sorted.join(' ')],expl:'Orden correcto: '+sorted.join(', ')+'.',_gen:1};
}
function genAlphaWrite(level){
  const {words,sorted}=genAlphaWords(level);
  return {t:'tx',mode:'list',q:'✍️ Ordena alfabéticamente (sepáralas con comas):\n'+shuffle(words).join(', '),ans:[sorted.join(', ')],hint:level===2?'Todas empiezan por la misma letra. Mira la 2ª y la 3ª.':'',_gen:1};
}

/* ═══════════ BANCO DE PREGUNTAS ═══════════ */
function poolOf(pack,mod,mode){
  if(mod.texts){
    const out=[];
    mod.texts.forEach(t=>(mode==='test'?t.test:t.write).forEach(q=>out.push(Object.assign({},q,{_text:{title:t.title,body:t.body,em:t.em},_tid:t.id}))));
    return out;
  }
  return (mode==='test'?mod.test:mod.write).map(q=>Object.assign({},q));
}
function qKey(q){return hash((q.q||'')+'|'+(q.ans&&q.ans[0]!==undefined?q.ans[0]:q.ans));}
function prepQ(q){q._k=qKey(q);if(q.t==='mc'){q._o=shuffle(q.opts);}if(q.t==='chips'){let s=shuffle(q.tokens);for(let i=0;i<9&&s.join(' ')===q.ans[0];i++)s=shuffle(q.tokens);q._tk=s;}return q;}
// elige n preguntas, dando prioridad a las falladas
function pickWeighted(items,weak,n){
  const w=items.filter(q=>(weak[qKey(q)]||0)>0), r=items.filter(q=>!((weak[qKey(q)]||0)>0));
  const nW=Math.min(w.length,Math.ceil(n*.4));
  return shuffle([...shuffle(w).slice(0,nW),...shuffle(r).slice(0,n-nW)]).slice(0,n);
}
function buildSession(kid,pack,mod,mode,n){
  n=n||10;
  const weak=(kid&&kid.weak)||{};
  if(mod.texts){
    // 2 textos (los menos recientes primero) con todas sus preguntas
    const all=poolOf(pack,mod,mode);
    const seen=(kid&&kid.textSeen)||{};
    const tids=mod.texts.map(t=>t.id).sort((a,b)=>(seen[a]||0)-(seen[b]||0)).slice(0,2);
    const qs=[];tids.forEach(id=>qs.push(...all.filter(q=>q._tid===id)));
    return {qs:qs.map(prepQ),tids};
  }
  let pool=poolOf(pack,mod,mode);
  let qs;
  if(mod.gen){
    const g=mode==='test'?[genAlphaChips(1),genAlphaChips(1),genAlphaChips(2),genAlphaChips(2)]:[genAlphaWrite(1),genAlphaWrite(2),genAlphaWrite(2)];
    qs=[...pickWeighted(pool,weak,n-g.length),...g];
    qs=shuffle(qs);
  } else qs=pickWeighted(pool,weak,Math.min(n,pool.length));
  return {qs:qs.map(prepQ)};
}
function buildSimulacro(kid,pack){
  const weak=(kid&&kid.weak)||{};
  const qs=[];
  pack.modules.filter(m=>!m.texts).forEach(m=>{
    let w=poolOf(pack,m,'write').filter(q=>!q.say);
    let t=poolOf(pack,m,'test');
    if(m.gen){w=[genAlphaWrite(1),genAlphaWrite(2)];}
    qs.push(...pickWeighted(w,weak,2).map(q=>Object.assign(q,{_mod:m.id})));
    qs.push(...pickWeighted(t,weak,1).map(q=>Object.assign(q,{_mod:m.id})));
  });
  const lm=pack.modules.find(m=>m.texts);
  if(lm){
    const t=rnd(lm.texts);
    t.test.slice(0,2).forEach(q=>qs.push(Object.assign({},q,{_text:{title:t.title,body:t.body,em:t.em},_mod:lm.id})));
    t.write.slice(0,2).forEach(q=>qs.push(Object.assign({},q,{_text:{title:t.title,body:t.body,em:t.em},_mod:lm.id})));
  }
  return {qs:qs.map(prepQ)};
}

function evalBadges(kid,ctx){

  const t=todayD();
  const up=CAL.filter(c=>c.pack&&parseD(c.d)>=t).sort((a,b)=>a.d<b.d?-1:1);
  if(up.length) return up[0];
  const past=CAL.filter(c=>c.pack).sort((a,b)=>a.d<b.d?-1:1);
  return past[past.length-1];
}
function nextAny(){const t=todayD();return CAL.filter(c=>parseD(c.d)>=t).sort((a,b)=>a.d<b.d?-1:1)[0];}
function countdownTxt(dateStr){
  const n=daysUntil(dateStr);
  return n<0?'Ya pasó':n===0?'¡HOY!':n===1?'¡MAÑANA!':'Faltan '+n+' días';
}
function planTasks(kid,pack,testDate){
  const D=Math.max(1,daysUntil(testDate));
  const mods=pack.modules.map((m,i)=>({id:m.id,i,v:(()=>{const a=modMastery(kid,m.id);return ((a.test===null?0:a.test)+(a.write===null?0:a.write))/2;})()}));
  mods.sort((a,b)=>a.v-b.v||a.i-b.i);
  const n=Math.min(4,Math.ceil(pack.modules.length/D));
  const ids=mods.slice(0,n).map(m=>m.id);
  const tasks=ids.map(id=>({id}));
  if(daysUntil(testDate)<=2) tasks.push({id:'sim'});
  return tasks;
}
function getMission(kid,pack,testDate){
  const k=dayKey();
  if(!kid.missions) kid.missions={};
  if(!kid.missions[k]) kid.missions[k]={tasks:planTasks(kid,pack,testDate).map(t=>t.id),done:{},awarded:false};
  return kid.missions[k];
}

  const g=PTS.tx;G.pts+=g;k.stat.ok++;k.stat.wrote++;
  const inp=document.getElementById('ti');
  k.selfOk.push({ts:Date.now(),q:q.q.replace(/\n/g,' '),user:inp?inp.value:'',a:q.ans[0]});if(k.selfOk.length>40)k.selfOk.shift();
  save();toast('Anotado para que mamá o papá lo revisen 👍');
  document.getElementById('fbox').innerHTML=`<div class="fb ok"><div class="big">✅ ¡Vale! <span style="float:right">+${g} ⭐</span></div><div class="ex">Tus padres lo revisarán.</div><button class="btn g" onclick="nextQ()">${G.i+1>=G.qs.length?'Ver resultado 🏁':'Siguiente ▸'}</button></div>`;
}
function nextQ(){G.i++;if(G.i>=G.qs.length)finish();else showQ();}

/* ═══════════ FINAL DE RONDA ═══════════ */
function finish(){
  const k=K(),n=G.qs.length,acc=G.right/n,nota=Math.round(acc*100)/10;
  const bonus=sessionBonus(acc,G.sim,nota);
  let total=G.pts+bonus;const notes=[];
  // racha diaria
  const today=dayKey(),yest=dayKey(new Date(todayD().getTime()-864e5));
  if(k.lastDay!==today){
    k.streak=(k.lastDay===yest)?k.streak+1:1;k.lastDay=today;
    const sb={3:30,5:50,7:80}[k.streak];if(sb){total+=sb;notes.push(`🔥 ¡${k.streak} días seguidos! +${sb} ⭐`);}
  }
  // histórico y dominio
  k.hist.push({ts:Date.now(),mod:G.sim?'sim':G.mod,mode:G.mode,right:G.right,total:n,pts:total});if(k.hist.length>300)k.hist.shift();
  if(!G.sim){const m=k.mast[G.mod]=k.mast[G.mod]||{test:[],write:[],n:0};m[G.mode].push(acc);if(m[G.mode].length>6)m[G.mode].shift();m.n++;}
  else{(k.sim=k.sim||[]).push(nota);
    // el simulacro también cuenta para el dominio de cada módulo
  }
  // misión diaria
  const c=activeTest(),ms=getMission(k,PACKS[c.pack],c.d);
  const tid=G.sim?'sim':G.mod;if(ms.tasks.includes(tid))ms.done[tid]=true;
  if(!ms.awarded&&ms.tasks.every(t=>ms.done[t])){ms.awarded=true;total+=40;notes.push('🎯 ¡Misión de hoy cumplida! +40 ⭐');}
  k.xp+=total;k.stars+=total;
  const got=evalBadges(k,{perfect:acc===1,sim:G.sim?nota:undefined});
  save();
  const st=G.sim?(nota>=9?3:nota>=7?2:nota>=5?1:0):stars3(acc);
  if(acc>=.8)confetti(30);beep(acc>=.6?'win':'no');
  const mis=G.mist.map(m=>`<div class="miss">❓ ${esc(m.q)}<br>✅ <b>${esc(m.a)}</b></div>`).join('');
  const rk=rankOf(k.xp);
  render(`${topBar(G.sim?'🏆 Resultado':'🏁 Resultado','showHome()')}
  <div class="res"><div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div>
  ${G.sim?`<div class="big">Nota: ${nota.toFixed(1)} / 10</div>`:`<div class="big">${G.right} / ${n}</div>`}
  <p style="font-weight:800;font-size:18px">${acc>=.9?'¡Increíble! 🤩':acc>=.7?'¡Muy bien! 😄':acc>=.5?'¡Vas mejorando! 💪':'¡Sigue practicando, tú puedes! 🌱'}</p>
  <div class="pts"><span class="chip y">+${G.pts} ⭐ respuestas</span><span class="chip y">+${bonus} ⭐ bonus ronda</span>${G.selfN?`<span class="chip">🤔 ${G.selfN} por revisar</span>`:''}</div>
  ${notes.map(x=>`<div class="chip o" style="display:block;margin:6px auto;max-width:340px">${x}</div>`).join('')}
  <div style="font-weight:900;font-size:20px;margin:8px 0">Total: +${total} ⭐ → ${k.stars} ⭐</div>
  <div class="small">${rk.em} ${rk.nm}${rk.next?' · faltan '+(rk.next-k.xp)+' ⭐ para subir':''}</div>
  ${mis?`<div class="mh" style="text-align:left">Repasa estas</div>${mis}`:'<p style="font-weight:800;color:var(--gr)">¡Sin fallos! 🎉</p>'}
  </div>
  <div style="padding:0 16px">${G.sim?`<button class="btn o" onclick="startSim()">🏆 Otro simulacro</button>`:`<button class="btn" onclick="startMod('${G.mod}','${G.mode}')">🔁 Otra ronda</button>`}
  <button class="btn ghost" onclick="showHome()">🏠 Volver al inicio</button></div>`);
  got.forEach((id,i)=>setTimeout(()=>{const b=allBadgeDefs().find(x=>x.id===id);if(b){modal(`<div class="e">${b.em}</div><h2>¡Nueva insignia!</h2><p><b>${b.nm}</b><br>${b.ds}</p><button class="btn" onclick="closeModal()">¡Genial!</button>`);confetti(24);beep('win');}},900+i*50));
  G=null;
}

/* ═══════════ CALENDARIO ═══════════ */
function showCal(){
  SCR='cal';const t=todayD();let last='',h='';
  const first=CAL.find(c=>parseD(c.d)>=t);
  CAL.forEach(c=>{
    const d=parseD(c.d),mk=d.getFullYear()+'-'+d.getMonth();
    if(mk!==last){last=mk;h+=`<div class="mh">${['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][d.getMonth()]} ${d.getFullYear()}</div>`;}
    const past=d<t,n=daysUntil(c.d),isNext=first&&first.d===c.d&&first.s===c.s;
    const tag=c.pack?`<span class="tag g">✅ Listo para estudiar</span>`:`<span class="tag y">🔜 Se prepara antes</span>`;
    h+=`<div class="cal ${past?'past':''}" style="--c:${SUBJ[c.s].col};${isNext?'box-shadow:0 0 0 3px #4F46E5,var(--sh)':''}" ${c.pack?`onclick="${KID?'showHome()':'toast(\'Elige primero quién estudia 😉\')'}"`:''}>
      <div class="dt">${d.getDate()}<b style="font-size:13px;color:var(--mu)">${MESES[d.getMonth()]}</b></div>
      <div class="info">${SUBJ[c.s].em} ${c.s} <span class="small">· ${c.n}</span><br>${past?'<span class="small">✔ Pasado</span>':tag+' <span class="small">'+countdownTxt(c.d)+'</span>'}
      ${c.topics?`<div class="tp">${esc(c.topics)}</div>`:''}${c.note?`<div class="tp">📝 ${esc(c.note)}</div>`:''}</div></div>`;
  });
  if(!KID){render(`<div class="top"><button class="back" onclick="showWelcome()">←</button><div class="ttl">📅 Calendario de Cycle Tests</div></div>${h}`);return;}
  render(`${topBar('📅 Calendario Cycle Tests')}${h}`,'cal');
}

/* ═══════════ TIENDA ═══════════ */
function showShop(){
  SCR='shop';const k=K();
  const items=S.shop.map(r=>`<div class="prize"><div class="e">${esc(r.em)}</div><div class="n">${esc(r.nm)}</div><div class="chip y">⭐ ${r.cost}</div>
    <button class="btn ${k.stars>=r.cost?'g':'ghost'} sm" onclick="buy('${r.id}')">${k.stars>=r.cost?'¡Lo quiero!':'Te faltan '+(r.cost-k.stars)}</button></div>`).join('');
  render(`${topBar('🛍️ Tienda de premios')}
  <div class="card" style="background:linear-gradient(135deg,#F59E0B,#EC4899);color:#fff"><div style="display:flex;align-items:center;gap:12px"><div style="font-size:50px">🎁</div><div style="flex:1"><b style="font-size:18px">Cofre misterioso</b><div style="font-size:13px;font-weight:700">¡Un premio sorpresa! A veces trae estrellas extra.</div></div></div><button class="btn sm" style="background:#fff;color:#BE185D;box-shadow:none" onclick="openChest()">Abrir por ⭐ ${CHEST_COST}</button></div>
  <div class="grid2" style="margin-top:6px">${items}</div>
  <p class="small" style="text-align:center;padding:10px 20px">Cuando canjees un premio, ¡enséñaselo a mamá o papá para que te lo den!</p>
  <div class="mh">Mis premios canjeados</div>${claimList(k,false)}`,'shop');
}
function claimList(k,forParent){
  if(!k.claims.length)return '<div class="card small">Todavía no has canjeado nada. ¡A ganar estrellas!</div>';
  return k.claims.slice().reverse().slice(0,20).map(c=>`<div class="card" style="margin:8px 16px;padding:12px;display:flex;gap:10px;align-items:center"><div style="font-size:30px">${esc(c.em)}</div><div style="flex:1;font-weight:800">${esc(c.nm)}<div class="small">${new Date(c.ts).toLocaleDateString('es-ES')}</div></div>${c.done?'<span class="tag g">Entregado ✅</span>':'<span class="tag y">Por entregar</span>'}${forParent&&!c.done?`<button class="btn g sm" style="width:auto;margin:0;padding:8px 12px" onclick="deliver('${KID_P}',${c.ts})">✓</button>`:''}</div>`).join('');
}
function buy(id){
  const k=K(),r=S.shop.find(x=>x.id===id);if(!r)return;
  if(k.stars<r.cost){toast('Aún te faltan '+(r.cost-k.stars)+' ⭐ ¡Tú puedes!');return;}
  modal(`<div class="e">${esc(r.em)}</div><h2>${esc(r.nm)}</h2><p>Cuesta <b>⭐ ${r.cost}</b>. Te quedarán ⭐ ${k.stars-r.cost}.</p><button class="btn g" onclick="confirmBuy('${id}')">¡Canjear!</button><button class="btn ghost sm" onclick="closeModal()">Mejor no</button>`);
}
function confirmBuy(id){
  const k=K(),r=S.shop.find(x=>x.id===id);if(!r||k.stars<r.cost)return;
  k.stars-=r.cost;k.claims.push({id:r.id,em:r.em,nm:r.nm,ts:Date.now(),done:false});save();closeModal();confetti(40);beep('win');
  modal(`<div class="e">🎉</div><h2>¡Premio canjeado!</h2><p><b>${esc(r.em)} ${esc(r.nm)}</b><br>Enséñaselo a mamá o papá.</p><button class="btn" onclick="closeModal();showShop()">¡Qué guay!</button>`);
}
function openChest(){
  const k=K();if(k.stars<CHEST_COST){toast('Te faltan '+(CHEST_COST-k.stars)+' ⭐');return;}
  k.stars-=CHEST_COST;
  let html;
  if(Math.random()<.25){const b=rnd([50,80,120,150]);k.stars+=b;html=`<div class="e">🌟</div><h2>¡Estrellas extra!</h2><p>El cofre traía <b>+${b} ⭐</b></p>`;}
  else{const p=rnd(CHEST_PRIZES);const em=[...p][0];k.claims.push({id:'chest',em:em,nm:p.slice(em.length).trim(),ts:Date.now(),done:false});html=`<div class="e">${em}</div><h2>¡Premio sorpresa!</h2><p><b>${esc(p.slice(em.length).trim())}</b><br>Pídeselo a mamá o papá.</p>`;}
  save();confetti(40);beep('win');modal(html+`<button class="btn" onclick="closeModal();showShop()">¡Genial!</button>`);
}

/* ═══════════ LOGROS ═══════════ */
function showAch(){
  SCR='ach';const k=K(),rk=rankOf(k.xp);
  const defs=allBadgeDefs();
  render(`${topBar('🏅 Mis logros')}
  <div class="card"><div class="profile"><div class="av">${rk.em}</div><div class="info"><div class="nm">${rk.nm}</div><div class="small">${k.xp} ⭐ ganadas en total · ${k.hist.length} rondas · racha máxima ${k.stat.combo}</div></div></div>
  <div class="small" style="margin-top:10px">${RANKS.map(r=>(k.xp>=r[0]?'':'🔒')+r[2]+' '+r[1]).join(' · ')}</div></div>
  <div class="mh">Insignias (${k.badges.length}/${defs.length})</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 16px">${defs.map(b=>`<div class="badge ${k.badges.includes(b.id)?'':'lock'}"><div class="e">${b.em}</div>${b.nm}<div class="small" style="font-size:11px">${b.ds}</div></div>`).join('')}</div>`,'ach');
}

/* ═══════════ ZONA DE PADRES ═══════════ */
let KID_P='k1',PTAB='res';
function showParent(){
  if(!S.pin){
    modal(`<div class="e">🔒</div><h2>Crea un PIN de padres</h2><p class="small">4 números. Lo necesitarás para entrar aquí (así los peques no cambian los premios).</p><input class="field" id="pin1" type="password" inputmode="numeric" maxlength="4" placeholder="••••" style="text-align:center;font-size:24px"><button class="btn" onclick="setPin()">Guardar PIN</button><button class="btn ghost sm" onclick="closeModal()">Cancelar</button>`);return;
  }
  modal(`<div class="e">🔒</div><h2>Zona de padres</h2><input class="field" id="pin1" type="password" inputmode="numeric" maxlength="4" placeholder="PIN" style="text-align:center;font-size:24px"><button class="btn" onclick="checkPin()">Entrar</button><button class="btn ghost sm" onclick="closeModal()">Cancelar</button>`);
  setTimeout(()=>{const i=document.getElementById('pin1');i&&i.focus();},60);
}
function setPin(){const v=document.getElementById('pin1').value;if(!/^\d{4}$/.test(v)){toast('Pon 4 números');return;}S.pin=v;save();closeModal();parentPanel();}
function checkPin(){const v=document.getElementById('pin1').value;if(v===S.pin){closeModal();parentPanel();}else toast('PIN incorrecto');}
function parentPanel(){
  SCR='par';
  const kid=S.kids[KID_P];
  const tabs=`<div class="tabs">${[['res','📊 Resumen'],['pri','🎁 Premios'],['aju','⚙️ Ajustes']].map(([k,l])=>`<button class="${PTAB===k?'on':''}" onclick="PTAB='${k}';parentPanel()">${l}</button>`).join('')}</div>
  <div class="tabs">${['k1','k2'].map(id=>`<button class="${KID_P===id?'on':''}" onclick="KID_P='${id}';parentPanel()">${esc(S.kids[id].emoji)} ${esc(S.kids[id].name)}</button>`).join('')}</div>`;
  let body='';
  if(PTAB==='res'){
    const rows=LEN1.modules.map(m=>{const a=modMastery(kid,m.id);return `<tr><td>${m.em} ${m.nm}</td><td>${a.test===null?'–':pct(a.test)+'%'}</td><td>${a.write===null?'–':pct(a.write)+'%'}</td><td>${a.n}</td></tr>`;}).join('');
    const miss=Object.values(kid.missed).sort((a,b)=>b.n-a.n).slice(0,8).map(m=>`<div class="miss">❓ ${esc(m.q)}<br>✅ <b>${esc(m.a)}</b> <span class="small">(falló ${m.n}×)</span></div>`).join('')||'<div class="small">Sin fallos registrados.</div>';
    const so=kid.selfOk.slice(-8).reverse().map(m=>`<div class="miss">🤔 ${esc(m.q)}<br>Escribió: <b>${esc(m.user)}</b> · Esperado: ${esc(m.a)}</div>`).join('')||'<div class="small">Ninguna.</div>';
    const sims=(kid.sim||[]).slice(-5).map(n=>n.toFixed(1)).join(' · ')||'–';
    body=`<div class="card"><h2>${esc(kid.emoji)} ${esc(kid.name)}</h2><div class="small">⭐ ${kid.stars} · 🔥 racha ${kid.streak} días · ${kid.hist.length} rondas · simulacros: ${sims}</div>
    <table class="tbl" style="margin-top:10px"><tr><th>Tema</th><th>🧪</th><th>✍️</th><th>Rondas</th></tr>${rows}</table></div>
    <div class="card"><h2>Preguntas más falladas</h2>${miss}</div>
    <div class="card"><h2>Respuestas «creo que también vale»</h2><div class="small">Para que decidas si estaban bien:</div>${so}</div>`;
  } else if(PTAB==='pri'){
    body=`<div class="mh">Premios por entregar</div>${claimsParent(kid)}
    <div class="mh">Catálogo de la tienda</div>
    <div class="card">${S.shop.map((r,i)=>`<div class="row"><input class="field" style="width:56px;text-align:center" value="${esc(r.em)}" onchange="shopEdit(${i},'em',this.value)"><input class="field" value="${esc(r.nm)}" onchange="shopEdit(${i},'nm',this.value)"><input class="field" style="width:80px" type="number" value="${r.cost}" onchange="shopEdit(${i},'cost',this.value)"><button class="btn sm" style="width:44px;margin:0;background:#FEE2E2;color:#B91C1C" onclick="shopDel(${i})">✕</button></div>`).join('')}
    <button class="btn ghost sm" onclick="shopAdd()">+ Añadir premio</button><p class="small">Pon aquí los regalos y planes reales. Un cofre misterioso cuesta ${CHEST_COST} ⭐.</p></div>`;
  } else {
    body=`<div class="card"><h2>Nombre y avatar</h2><input class="field" value="${esc(kid.name)}" onchange="S.kids[KID_P].name=this.value;save()">
      <div class="keys" style="margin-top:8px">${AVATARS.map(a=>`<button onclick="S.kids[KID_P].emoji='${a}';save();parentPanel()" style="${kid.emoji===a?'background:#4F46E5;color:#fff':''}">${a}</button>`).join('')}</div></div>
    <div class="card"><h2>Dar o quitar estrellas</h2><div class="row"><input class="field" id="mpts" type="number" placeholder="± estrellas"><button class="btn sm" style="width:90px;margin:0" onclick="manualPts()">Aplicar</button></div><p class="small">Para premiar deberes, buen comportamiento, etc.</p></div>
    <div class="card"><h2>Seguridad y datos</h2><button class="btn ghost sm" onclick="changePin()">Cambiar PIN</button><button class="btn ghost sm" onclick="S.sound=!S.sound;save();toast(S.sound?'Sonido activado':'Sonido desactivado')">🔊 Activar / desactivar sonidos</button>
    <button class="btn sm" style="background:#FEE2E2;color:#B91C1C;box-shadow:none" onclick="resetKid()">Reiniciar progreso de ${esc(kid.name)}</button></div>`;
  }
  render(`<div class="top"><button class="back" onclick="${KID?'showHome()':'showWelcome()'}">←</button><div class="ttl">🔒 Zona de padres</div></div>${tabs}${body}`);
}
function claimsParent(kid){
  const pend=kid.claims.filter(c=>!c.done);
  if(!pend.length)return '<div class="card small">No hay premios pendientes.</div>';
  return pend.map(c=>`<div class="card" style="margin:8px 16px;padding:12px;display:flex;gap:10px;align-items:center"><div style="font-size:30px">${esc(c.em)}</div><div style="flex:1;font-weight:800">${esc(c.nm)}<div class="small">${new Date(c.ts).toLocaleDateString('es-ES')}</div></div><button class="btn g sm" style="width:auto;margin:0;padding:8px 14px" onclick="deliver(${c.ts})">Entregado ✓</button></div>`).join('');
}
function deliver(ts){const c=S.kids[KID_P].claims.find(x=>x.ts===ts);if(c){c.done=true;save();parentPanel();}}
function shopEdit(i,f,v){S.shop[i][f]=f==='cost'?Math.max(10,parseInt(v)||10):v;save();}
function shopDel(i){if(confirm('¿Quitar este premio?')){S.shop.splice(i,1);save();parentPanel();}}
function shopAdd(){S.shop.push({id:'r'+Date.now(),em:'🎁',nm:'Nuevo premio',cost:300});save();parentPanel();}
function manualPts(){const v=parseInt(document.getElementById('mpts').value);if(!v)return;const k=S.kids[KID_P];k.stars=Math.max(0,k.stars+v);if(v>0)k.xp+=v;k.manual.push({ts:Date.now(),v});save();toast((v>0?'+':'')+v+' ⭐ aplicadas');parentPanel();}
function changePin(){const v=prompt('Nuevo PIN (4 números):');if(v&&/^\d{4}$/.test(v)){S.pin=v;save();toast('PIN cambiado');}else if(v)toast('Debe tener 4 números');}
function resetKid(){if(confirm('¿Seguro? Se borrará TODO el progreso de este niño/a.')&&confirm('Última confirmación: ¿borrar progreso?')){const k=S.kids[KID_P];S.kids[KID_P]=defKid(k.name,k.emoji);save();parentPanel();}}

showWelcome();


</script></body></html>
