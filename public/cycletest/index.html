function confirmBuy(id){
  const k=K(),r=S.shop.find(x=>x.id===id);if(!r||k.stars<r.cost)return;
  k.stars-=r.cost;k.claims.push({id:r.id,em:r.em,nm:r.nm,ts:Date.now(),done:false});save();closeModal();confetti(40);beep('win');
  modal(`<div class="e">🎉</div><h2>¡Premio canjeado!</h2><p><b>${esc(r.em)} ${esc(r.nm)}</b><br>Enséñaselo a mamá o papá.</p><button class="btn" onclick="closeModal();showShop()">¡Qué guay!</button>`);
}
function openChest(){
  const k=K();if(k.stars<CHEST_COST){toast('Te faltan '+(CHEST_COST-k.stars)+' ⭐');return;}
  k.stars-=CHEST_COST;
  let html;
  if(Math.random()<.25){const b=rnd([50,80,120,150]);k.stars+=b;html=`<div class="e">🌟</div><h2>¡Estrellas extra!</h2><p>El cofre traía <b>+${b} ⭐</b></p>`;}
  else{const p=rnd(CHEST_PRIZES);const em=[...p][0];k.claims.push({id:'chest',em:em,nm:p.slice(em.length).trim(),ts:Date.now(),done:false});html=`<div class="e">${em}</div><h2>¡Premio sorpresa!</h2><p><b>${esc(p.slice(em.length).trim())}</b><br>Pídeselo a mamá o papá.</p>`;}
  save();confetti(40);beep('win');modal(html+`<button class="btn" onclick="closeModal();showShop()">¡Genial!</button>`);
}

/* ═══════════ LOGROS ═══════════ */
function showAch(){
  SCR='ach';const k=K(),rk=rankOf(k.xp);
  const defs=allBadgeDefs();
  render(`${topBar('🏅 Mis logros')}
  <div class="card"><div class="profile"><div class="av">${rk.em}</div><div class="info"><div class="nm">${rk.nm}</div><div class="small">${k.xp} ⭐ ganadas en total · ${k.hist.length} rondas · racha máxima ${k.stat.combo}</div></div></div>
  <div class="small" style="margin-top:10px">${RANKS.map(r=>(k.xp>=r[0]?'':'🔒')+r[2]+' '+r[1]).join(' · ')}</div></div>
  <div class="mh">Insignias (${k.badges.length}/${defs.length})</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 16px">${defs.map(b=>`<div class="badge ${k.badges.includes(b.id)?'':'lock'}"><div class="e">${b.em}</div>${b.nm}<div class="small" style="font-size:11px">${b.ds}</div></div>`).join('')}</div>`,'ach');
}

/* ═══════════ ZONA DE PADRES ═══════════ */
let KID_P='k1',PTAB='res';
function showParent(){
  if(!S.pin){
    modal(`<div class="e">🔒</div><h2>Crea un PIN de padres</h2><p class="small">4 números. Lo necesitarás para entrar aquí (así los peques no cambian los premios).</p><input class="field" id="pin1" type="password" inputmode="numeric" maxlength="4" placeholder="••••" style="text-align:center;font-size:24px"><button class="btn" onclick="setPin()">Guardar PIN</button><button class="btn ghost sm" onclick="closeModal()">Cancelar</button>`);return;
  }
  modal(`<div class="e">🔒</div><h2>Zona de padres</h2><input class="field" id="pin1" type="password" inputmode="numeric" maxlength="4" placeholder="PIN" style="text-align:center;font-size:24px"><button class="btn" onclick="checkPin()">Entrar</button><button class="btn ghost sm" onclick="closeModal()">Cancelar</button>`);
  setTimeout(()=>{const i=document.getElementById('pin1');i&&i.focus();},60);
}
function setPin(){const v=document.getElementById('pin1').value;if(!/^\d{4}$/.test(v)){toast('Pon 4 números');return;}S.pin=v;save();closeModal();parentPanel();}
function checkPin(){const v=document.getElementById('pin1').value;if(v===S.pin){closeModal();parentPanel();}else toast('PIN incorrecto');}
function parentPanel(){
  SCR='par';
  const kid=S.kids[KID_P];
  const tabs=`<div class="tabs">${[['res','📊 Resumen'],['pri','🎁 Premios'],['aju','⚙️ Ajustes']].map(([k,l])=>`<button class="${PTAB===k?'on':''}" onclick="PTAB='${k}';parentPanel()">${l}</button>`).join('')}</div>
  <div class="tabs">${['k1','k2'].map(id=>`<button class="${KID_P===id?'on':''}" onclick="KID_P='${id}';parentPanel()">${esc(S.kids[id].emoji)} ${esc(S.kids[id].name)}</button>`).join('')}</div>`;
  let body='';
  if(PTAB==='res'){
    const rows=Object.values(PACKS).map(p=>`<tr><th colspan="4" style="padding-top:10px">${SUBJ[p.subject].em} ${p.subject} · ${p.ct}</th></tr>`+p.modules.map(m=>{const a=modMastery(kid,m.id);return `<tr><td>${m.em} ${m.nm}</td><td>${a.test===null?'–':pct(a.test)+'%'}</td><td>${a.write===null?'–':pct(a.write)+'%'}</td><td>${a.n}</td></tr>`;}).join('')).join('');
    const miss=Object.values(kid.missed).sort((a,b)=>b.n-a.n).slice(0,8).map(m=>`<div class="miss">❓ ${esc(m.q)}<br>✅ <b>${esc(m.a)}</b> <span class="small">(falló ${m.n}×)</span></div>`).join('')||'<div class="small">Sin fallos registrados.</div>';
    const so=kid.selfOk.slice(-8).reverse().map(m=>`<div class="miss">🤔 ${esc(m.q)}<br>Escribió: <b>${esc(m.user)}</b> · Esperado: ${esc(m.a)}</div>`).join('')||'<div class="small">Ninguna.</div>';
    const sims=(kid.sim||[]).slice(-5).map(n=>n.toFixed(1)).join(' · ')||'–';
    body=`<div class="card"><h2>${esc(kid.emoji)} ${esc(kid.name)}</h2><div class="small">⭐ ${kid.stars} · 🔥 racha ${kid.streak} días · ${kid.hist.length} rondas · simulacros: ${sims}</div>
    <table class="tbl" style="margin-top:10px"><tr><th>Tema</th><th>🧪</th><th>✍️</th><th>Rondas</th></tr>${rows}</table></div>
    <div class="card"><h2>Preguntas más falladas</h2>${miss}</div>
    <div class="card"><h2>Respuestas «creo que también vale»</h2><div class="small">Para que decidas si estaban bien:</div>${so}</div>`;
  } else if(PTAB==='pri'){
    body=`<div class="mh">Premios por entregar</div>${claimsParent(kid)}
    <div class="mh">Catálogo de la tienda</div>
    <div class="card">${S.shop.map((r,i)=>`<div class="row"><input class="field" style="width:56px;text-align:center" value="${esc(r.em)}" onchange="shopEdit(${i},'em',this.value)"><input class="field" value="${esc(r.nm)}" onchange="shopEdit(${i},'nm',this.value)"><input class="field" style="width:80px" type="number" value="${r.cost}" onchange="shopEdit(${i},'cost',this.value)"><button class="btn sm" style="width:44px;margin:0;background:#FEE2E2;color:#B91C1C" onclick="shopDel(${i})">✕</button></div>`).join('')}
    <button class="btn ghost sm" onclick="shopAdd()">+ Añadir premio</button><p class="small">Pon aquí los regalos y planes reales. Un cofre misterioso cuesta ${CHEST_COST} ⭐.</p></div>`;
  } else {
    body=`<div class="card"><h2>Nombre y avatar</h2><input class="field" value="${esc(kid.name)}" onchange="S.kids[KID_P].name=this.value;save()">
      <div class="keys" style="margin-top:8px">${AVATARS.map(a=>`<button onclick="S.kids[KID_P].emoji='${a}';save();parentPanel()" style="${kid.emoji===a?'background:#4F46E5;color:#fff':''}">${a}</button>`).join('')}</div></div>
    <div class="card"><h2>Dar o quitar estrellas</h2><div class="row"><input class="field" id="mpts" type="number" placeholder="± estrellas"><button class="btn sm" style="width:90px;margin:0" onclick="manualPts()">Aplicar</button></div><p class="small">Para premiar deberes, buen comportamiento, etc.</p></div>
    <div class="card"><h2>🔓 Apertura del repaso</h2><div class="small">El repaso de cada Cycle Test se abre unos días antes del examen.</div>
      <div class="row"><span style="font-weight:800">Días de antelación:</span><select class="field" style="width:90px" onchange="S.unlockDays=parseInt(this.value);save();parentPanel()">${[0,1,2,3,4,5,7].map(n=>`<option value="${n}" ${S.unlockDays===n?'selected':''}>${n}</option>`).join('')}</select></div>
      ${CAL.filter(c=>c.pack).map(c=>{const key=testKey(c),op=isOpen(c,S.unlockDays,S.unlock[key]),forced=!!S.unlock[key];return `<div class="row"><div style="flex:1;font-weight:800;font-size:14px">${SUBJ[c.s].em} ${c.s} · ${c.n}<div class="small">${fmtDate(c.d)} · ${op?'✅ abierto':'🔒 se abre el '+fmtDate(dayKey(opensOnDate(c,S.unlockDays)))}</div></div>${(!op||forced)?`<button class="btn sm ${forced?'':'g'}" style="width:auto;margin:0;padding:8px 12px" onclick="toggleUnlock('${key}')">${forced?'Volver a cerrar':'Abrir ya'}</button>`:''}</div>`;}).join('')}</div>
    <div class="card"><h2>Seguridad y datos</h2><div class="small">Versión de la app: ${APP_VERSION}</div><button class="btn ghost sm" onclick="changePin()">Cambiar PIN</button><button class="btn ghost sm" onclick="location.href=location.pathname+'?v='+Date.now()">🔄 Forzar actualización</button><button class="btn ghost sm" onclick="S.sound=!S.sound;save();toast(S.sound?'Sonido activado':'Sonido desactivado')">🔊 Activar / desactivar sonidos</button>
    <button class="btn sm" style="background:#FEE2E2;color:#B91C1C;box-shadow:none" onclick="resetKid()">Reiniciar progreso de ${esc(kid.name)}</button></div>`;
  }
  render(`<div class="top"><button class="back" onclick="${KID?'showHome()':'showWelcome()'}">←</button><div class="ttl">🔒 Zona de padres</div></div>${tabs}${body}`);
}
function claimsParent(kid){
  const pend=kid.claims.filter(c=>!c.done);
  if(!pend.length)return '<div class="card small">No hay premios pendientes.</div>';
  return pend.map(c=>`<div class="card" style="margin:8px 16px;padding:12px;display:flex;gap:10px;align-items:center"><div style="font-size:30px">${esc(c.em)}</div><div style="flex:1;font-weight:800">${esc(c.nm)}<div class="small">${new Date(c.ts).toLocaleDateString('es-ES')}</div></div><button class="btn g sm" style="width:auto;margin:0;padding:8px 14px" onclick="deliver(${c.ts})">Entregado ✓</button></div>`).join('');
}
function toggleUnlock(k){if(S.unlock[k])delete S.unlock[k];else S.unlock[k]=true;save();parentPanel();}
function deliver(ts){const c=S.kids[KID_P].claims.find(x=>x.ts===ts);if(c){c.done=true;save();parentPanel();}}
function shopEdit(i,f,v){S.shop[i][f]=f==='cost'?Math.max(10,parseInt(v)||10):v;save();}
function shopDel(i){if(confirm('¿Quitar este premio?')){S.shop.splice(i,1);save();parentPanel();}}
function shopAdd(){S.shop.push({id:'r'+Date.now(),em:'🎁',nm:'Nuevo premio',cost:300});save();parentPanel();}
function manualPts(){const v=parseInt(document.getElementById('mpts').value);if(!v)return;const k=S.kids[KID_P];k.stars=Math.max(0,k.stars+v);if(v>0)k.xp+=v;k.manual.push({ts:Date.now(),v});save();toast((v>0?'+':'')+v+' ⭐ aplicadas');parentPanel();}
function changePin(){const v=prompt('Nuevo PIN (4 números):');if(v&&/^\d{4}$/.test(v)){S.pin=v;save();toast('PIN cambiado');}else if(v)toast('Debe tener 4 números');}
function resetKid(){if(confirm('¿Seguro? Se borrará TODO el progreso de este niño/a.')&&confirm('Última confirmación: ¿borrar progreso?')){const k=S.kids[KID_P];S.kids[KID_P]=defKid(k.name,k.emoji);save();parentPanel();}}

/* ═══════════ AUTO-ACTUALIZACIÓN (para tablets que guardan la versión vieja en caché) ═══════════ */
function showUpdateBanner(){
  if(document.getElementById('upd'))return;
  const b=document.createElement('div');b.id='upd';
  b.style.cssText='position:fixed;left:12px;right:12px;bottom:84px;max-width:536px;margin:0 auto;background:#16A34A;color:#fff;border-radius:18px;padding:14px 16px;z-index:70;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px';
  b.innerHTML='<span style="flex:1">🔄 ¡Hay una versión nueva con más contenido!</span><button style="background:#fff;color:#166534;border-radius:12px;padding:10px 14px;font-weight:900;font-size:15px" onclick="location.href=location.pathname+\'?v=\'+Date.now()">Actualizar</button>';
  document.body.appendChild(b);
}
function checkNewVersion(){
  try{
    fetch(location.pathname+'?chk='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{
      const m=t.match(/APP_VERSION='([^']+)'/);
      if(m&&m[1]!==APP_VERSION){window.__newVer=m[1];showUpdateBanner();}
    }).catch(()=>{});
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkNewVersion();});
checkNewVersion();
showWelcome();


</script></body></html>
