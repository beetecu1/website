<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌟 SuperSaber</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --pu:#7C3AED;--pl:#EDE9FE;
  --gr:#16A34A;--gl:#F0FDF4;
  --or:#EA580C;--ol:#FFF7ED;
  --ye:#D97706;--yl:#FFFBEB;
  --re:#DC2626;
  --bg:#F5F3FF;--tx:#1F2937;--mu:#6B7280;
  --r:18px;--sh:0 4px 20px rgba(0,0,0,.10)
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:18px;overscroll-behavior:none}
#app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;padding:18px;gap:14px}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:2px solid #F3F4F6;position:sticky;top:0;z-index:10}
.hdr-l{display:flex;align-items:center;gap:9px}
.hdr-title{font-size:17px;font-weight:800}
.hdr-sub{font-size:11px;color:var(--mu);font-weight:600}
.back-btn{width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid #E5E7EB;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;flex-shrink:0}
.back-btn:active{background:#F3F4F6}
.coins-pill{display:flex;align-items:center;gap:4px;background:var(--yl);color:var(--ye);padding:5px 12px;border-radius:999px;font-weight:800;font-size:15px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:13px 24px;border-radius:var(--r);border:none;font-size:17px;font-weight:700;cursor:pointer;transition:transform .1s;min-height:50px;user-select:none}
.btn:active{transform:scale(.96)}
.btn-pu{background:var(--pu);color:#fff;box-shadow:0 4px 12px rgba(124,58,237,.28)}
.btn-gr{background:var(--gr);color:#fff;box-shadow:0 4px 12px rgba(22,163,74,.22)}
.btn-ye{background:var(--ye);color:#fff}
.btn-or{background:var(--or);color:#fff}
.btn-gh{background:#fff;color:var(--tx);border:2px solid #E5E7EB}
.btn-bl{width:100%}
.btn-lg{padding:16px 32px;font-size:20px;min-height:60px}
.card{background:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--sh)}

/* WELCOME */
.hero{text-align:center;padding:32px 16px 16px}
.hero-em{font-size:84px;line-height:1}
.hero-t{font-size:36px;font-weight:900;color:var(--pu);margin:8px 0 4px}
.hero-s{color:var(--mu);font-size:16px}
.p-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.p-card{background:#fff;border-radius:var(--r);padding:24px 12px;text-align:center;box-shadow:var(--sh);cursor:pointer;border:4px solid transparent;transition:transform .15s}
.p-card:active{transform:scale(.96)}
.p1{border-color:var(--pu)}
.p2{border-color:var(--or)}
.p-av{font-size:56px;line-height:1;margin-bottom:7px}
.p-nm{font-size:19px;font-weight:800}
.p-co{font-size:13px;color:var(--ye);font-weight:700;margin-top:3px}

/* HOME */
.av-box{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 0 12px}
.av-big{font-size:80px;line-height:1}
.av-nm{font-size:22px;font-weight:900}
.av-stats{display:flex;gap:16px;font-size:14px;color:var(--mu);font-weight:600}
.stat-chip{display:flex;align-items:center;gap:4px}
.hm-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hm-btn{background:#fff;border-radius:var(--r);padding:18px 12px;text-align:center;box-shadow:var(--sh);cursor:pointer;transition:transform .1s;border:none;width:100%;border-top:5px solid #ccc}
.hm-btn:active{transform:scale(.96)}
.hm-em{font-size:36px;line-height:1;margin-bottom:5px}
.hm-nm{font-size:16px;font-weight:800}
.hm-su{font-size:12px;color:var(--mu);margin-top:2px}
.hm-math{border-top-color:#8B5CF6}.hm-lang{border-top-color:var(--gr)}
.hm-tro{border-top-color:var(--ye)}.hm-shop{border-top-color:var(--or)}
.hm-stat{border-top-color:#06B6D4}.hm-parent{border-top-color:#374151}
.hm-cien{border-top-color:#0D9488}
/* CIENCIAS */
.lv-card.u-cien{border-left-color:#0D9488;cursor:pointer;transition:transform .12s}
.lv-card.u-cien:active{transform:scale(.98)}
.lv-card.done-cien{border-left-color:#0D9488}
.lv-badge-cien{background:#0D9488}
/* ACENTUACIÓN */
.acent-word{font-size:52px;font-weight:900;color:var(--pu);letter-spacing:6px;text-align:center;line-height:1.1}
.acent-syl{font-size:20px;font-weight:700;color:var(--mu);letter-spacing:3px;text-align:center}
/* CIENCIA CARD */
.cien-card{background:linear-gradient(135deg,#0F766E,#0D9488);border-radius:var(--r);padding:18px;color:#fff;text-align:center;width:100%}
.cien-em{font-size:52px;margin-bottom:6px}
.cien-fact{background:#F0FDFA;border-radius:12px;padding:13px;font-size:13px;color:#134E4A;font-weight:600;line-height:1.65;border-left:4px solid #0D9488;text-align:left;width:100%;box-sizing:border-box}

/* TRACK MAP */
.map-hdr{display:flex;align-items:center;justify-content:space-between}
.map-t{font-size:19px;font-weight:900}
.map-p{font-size:13px;color:var(--mu);font-weight:700}
.lv-card{background:#fff;border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);border-left:6px solid #E5E7EB;position:relative}
.lv-card.u-math{border-left-color:var(--pu);cursor:pointer;transition:transform .12s}
.lv-card.u-lang{border-left-color:var(--gr);cursor:pointer;transition:transform .12s}
.lv-card.u-math:active,.lv-card.u-lang:active{transform:scale(.98)}
.lv-card.done-math{border-left-color:var(--ye)}
.lv-card.done-lang{border-left-color:var(--gr)}
.lv-card.locked{opacity:.55}
.lv-row{display:flex;align-items:center;gap:12px}
.lv-ic{font-size:32px;flex-shrink:0}
.lv-inf{flex:1;min-width:0}
.lv-nh{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.lv-num{font-size:11px;color:var(--mu);font-weight:700;letter-spacing:.7px;text-transform:uppercase}
.lv-nm{font-size:16px;font-weight:800}
.lv-de{font-size:12px;color:var(--mu);margin-top:1px}
.lv-badge{background:var(--pu);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
.lv-badge-g{background:var(--gr)}
.dd{display:flex;gap:3px;margin-top:5px}
.dd-dot{width:7px;height:7px;border-radius:50%}
.dd-on{background:var(--ye)}.dd-off{background:#E5E7EB}

/* GAME */
.gw{flex:1;display:flex;flex-direction:column;gap:14px;padding:16px}
.pr-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pr-lbl{font-size:13px;color:var(--mu);font-weight:700;white-space:nowrap}
.streak-p{background:linear-gradient(135deg,#F97316,#EF4444);color:#fff;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:800;transition:opacity .25s}
.pr-c{font-size:13px;color:var(--ye);font-weight:800;white-space:nowrap}
.pb{height:10px;background:#E5E7EB;border-radius:999px;overflow:hidden}
.pf{height:100%;background:linear-gradient(90deg,var(--pu),#EC4899);border-radius:999px;transition:width .4s ease}
.qc{background:#fff;border-radius:var(--r);padding:24px 18px;box-shadow:var(--sh);text-align:center;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.ql{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
.qt{font-size:20px;font-weight:800;line-height:1.4}
.qb{font-size:50px;font-weight:900;color:var(--pu);letter-spacing:2px}
.tip{background:var(--yl);border-left:4px solid var(--ye);border-radius:10px;padding:8px 12px;font-size:13px;width:100%;text-align:left}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opts4{grid-template-columns:repeat(4,1fr)}
.opt{background:var(--pl);color:var(--pu);border:3px solid transparent;border-radius:var(--r);padding:13px 8px;font-size:17px;font-weight:700;cursor:pointer;transition:all .15s;min-height:54px}
.opt:active{transform:scale(.96)}
.opt.lc{background:#D1FAE5;color:var(--gr)}
.opt.ok{background:#DCFCE7!important;color:#15803D!important;border-color:var(--gr)!important}
.opt.no{background:#FEE2E2!important;color:var(--re)!important;border-color:var(--re)!important}
.tin{width:100%;padding:14px 16px;font-size:22px;font-weight:700;border:3px solid #E5E7EB;border-radius:var(--r);text-align:center;outline:none;transition:border-color .2s}
.tin:focus{border-color:var(--pu)}
.nmin{width:100%;padding:12px 16px;font-size:18px;font-weight:700;border:3px solid #E5E7EB;border-radius:var(--r);text-align:center;outline:none}
.nmin:focus{border-color:var(--pu)}
.fw{font-size:34px;font-weight:900;letter-spacing:3px}
.fb{display:inline-block;min-width:32px;border-bottom:5px solid var(--pu);text-align:center;color:var(--pu);font-weight:900}
.sen{font-size:18px;line-height:2.2;text-align:center}
.ew{display:inline-block;background:var(--pl);color:var(--pu);padding:3px 10px;border-radius:9px;cursor:pointer;font-weight:700;border:2px solid transparent;margin:2px 3px;transition:all .15s}
.ew:active{opacity:.75}
.ew.ok{background:#DCFCE7!important;color:#15803D!important;border-color:var(--gr)!important}
.ew.no{background:#FEE2E2!important;color:var(--re)!important;border-color:var(--re)!important}
.scr{font-size:28px;font-weight:900;letter-spacing:8px;color:var(--or)}
.shb{width:152px;height:152px;margin:0 auto}

/* FEEDBACK */
.fbo{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:70;pointer-events:none;opacity:0;transition:opacity .2s}
.fbo.show{opacity:1;pointer-events:all}
.fb-ok{background:rgba(22,163,74,.93)}.fb-fail{background:rgba(220,38,38,.9)}
.fb-em{font-size:74px}.fb-mg{font-size:26px;font-weight:900;color:#fff}.fb-dt{font-size:15px;color:#fff;opacity:.9;max-width:84%;text-align:center;line-height:1.5}

/* CHEST */
.chest-ov{position:fixed;inset:0;background:linear-gradient(160deg,#1E1B4B,#4C1D95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:60;transition:opacity .35s;padding:24px}
.chest-ov.out{opacity:0;pointer-events:none}
.chest-t{font-size:22px;font-weight:900;color:#fff;text-align:center}
.chest-em{font-size:96px;line-height:1}
.chest-hint{font-size:15px;color:rgba(255,255,255,.65);font-weight:600}
.chest-coins{font-size:52px;font-weight:900;color:#FCD34D}
.chest-star{font-size:34px}
.chest-achs{display:flex;flex-direction:column;gap:9px;width:100%}
.chest-ab{background:rgba(255,255,255,.14);border-radius:14px;padding:11px 16px;display:flex;align-items:center;gap:11px;color:#fff;font-size:15px;font-weight:700}
.chest-btn{background:#fff;color:var(--pu);font-size:17px;font-weight:800;padding:14px 36px;border-radius:999px;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.25);margin-top:6px}
.chest-btn:active{transform:scale(.96)}

/* RESULTS */
.res-card{text-align:center;padding:28px 20px}
.res-em{font-size:68px;line-height:1}
.res-sc{font-size:64px;font-weight:900;color:var(--pu);line-height:1;margin:4px 0}
.res-st{font-size:34px;margin:4px 0}
.res-mg{font-size:20px;font-weight:700;margin:6px 0 3px}
.res-sb{color:var(--mu);font-size:14px}
.unlock-ban{background:linear-gradient(135deg,#F59E0B,#F97316);color:#fff;border-radius:var(--r);padding:14px 18px;text-align:center;font-weight:800;font-size:16px;box-shadow:var(--sh)}
.repaso-tag{display:inline-flex;align-items:center;gap:4px;background:#FEF3C7;color:#B45309;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.smart-panel{background:#FFFBEB;border:2px solid #FDE68A;border-radius:var(--r);padding:14px 16px}
.smart-panel-t{font-size:11px;font-weight:800;color:var(--mu);letter-spacing:.8px;margin-bottom:8px}
.smart-ok{color:#15803D;font-size:14px;font-weight:600;margin-bottom:5px}
.smart-warn{color:#B45309;font-size:14px;font-weight:600}

/* SHOP */
.sh-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.sh-item{background:#fff;border-radius:var(--r);padding:14px 8px;text-align:center;box-shadow:var(--sh);border:3px solid transparent}
.sh-item.owned{border-color:var(--gr)}
.sh-item.active{border-color:var(--ye);background:var(--yl)}
.sh-em{font-size:38px;line-height:1;margin-bottom:5px}
.sh-nm{font-size:12px;font-weight:700;color:var(--mu);margin-bottom:6px}
.sh-btn{border:none;border-radius:10px;padding:6px 0;font-size:12px;font-weight:700;cursor:pointer;width:100%}
.sb-buy{background:var(--pu);color:#fff}
.sb-eq{background:var(--gr);color:#fff}
.sb-cur{background:var(--ye);color:#fff;cursor:default}
.sb-bk{background:#E5E7EB;color:#9CA3AF;cursor:default}
.coins-bar{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--yl);border-radius:999px;padding:10px 22px;font-size:17px;font-weight:800;color:var(--ye)}

/* TROPHIES */
.ach-list{display:flex;flex-direction:column;gap:10px}
.ach-row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--r);padding:13px 16px;box-shadow:var(--sh)}
.ach-row.locked{opacity:.4}
.ach-em{font-size:28px;flex-shrink:0}
.ach-inf{flex:1}
.ach-nm{font-size:15px;font-weight:800}
.ach-ds{font-size:12px;color:var(--mu);margin-top:2px}
.ach-ck{font-size:18px;color:var(--gr)}

/* CONFETTI */
.cc{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:200}
.cp{position:absolute;width:12px;height:12px;top:-20px;animation:fall linear forwards}

/* ANIMATIONS */
@keyframes fall{from{transform:translateY(-20px) rotate(0deg);opacity:1}to{transform:translateY(110vh) rotate(540deg);opacity:0}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes coin-pop{0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.2) rotate(5deg)}100%{transform:scale(1) rotate(0deg);opacity:1}}
.pop{animation:pop .35s ease forwards}
.bounce{animation:bounce .7s ease infinite}
.coin-pop{animation:coin-pop .5s ease forwards}

/* LOGIC & CURIO HOME BUTTONS */
.hm-logic{border-top-color:#7C3AED}
.hm-curio{border-top-color:#0EA5E9}
/* TRACK MAP: logic & curio */
.lv-card.u-logic{border-left-color:var(--pu);cursor:pointer;transition:transform .12s}
.lv-card.u-curio{border-left-color:#0EA5E9;cursor:pointer;transition:transform .12s}
.lv-card.u-logic:active,.lv-card.u-curio:active{transform:scale(.98)}
.lv-card.done-logic{border-left-color:var(--pu)}
.lv-card.done-curio{border-left-color:#0EA5E9}
.lv-badge-logic{background:var(--pu)}
.lv-badge-curio{background:#0EA5E9}
/* SEQ */
.seq-items{display:flex;flex-direction:column;gap:8px;width:100%}
.seq-item{background:var(--pl);color:var(--pu);border:3px solid transparent;border-radius:var(--r);padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .15s;text-align:left;width:100%}
.seq-item:active{transform:scale(.97)}
.seq-item.picked{border-color:var(--pu);background:#DDD6FE}
.seq-item.correct{background:#DCFCE7!important;color:#15803D!important;border-color:var(--gr)!important}
.seq-item.wrong{background:#FEE2E2!important;color:var(--re)!important;border-color:var(--re)!important}
.seq-num{min-width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;flex-shrink:0}
.seq-num.filled{background:var(--pu);color:#fff}
.seq-num.empty{background:#D1D5DB;color:var(--tx)}
/* SUDOKU */
.sdk-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.sdk-grid{display:grid;grid-template-columns:repeat(4,1fr);border:3px solid #374151;border-radius:6px;overflow:hidden;width:240px;margin:0 auto}
.sdk-cell{width:60px;height:60px;border:1px solid #D1D5DB;background:#fff;font-size:28px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--pu);transition:background .12s}
.sdk-cell.fixed{background:#F3F4F6;color:#374151;cursor:default}
.sdk-cell.sel{background:var(--pl)}
.sdk-cell.err{background:#FEE2E2!important;color:var(--re)!important}
.sdk-cell.good{background:#DCFCE7!important;color:#15803D!important}
.sdk-box-r{border-right:3px solid #374151!important}
.sdk-box-b{border-bottom:3px solid #374151!important}
.sdk-nums{display:flex;gap:10px;justify-content:center}
.sdk-num{width:52px;height:52px;background:var(--pu);color:#fff;border-radius:12px;border:none;font-size:24px;font-weight:900;cursor:pointer;transition:transform .12s}
.sdk-num:active{transform:scale(.9)}
.sdk-del{background:#EF4444!important}
/* SOPA DE LETRAS */
.sopa-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.sopa-grid{display:inline-grid;gap:3px}
.sopa-cell{width:36px;height:36px;border-radius:6px;background:#F3F4F6;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;cursor:pointer;transition:all .12s;user-select:none;-webkit-user-select:none;border:2px solid transparent}
.sopa-cell.sel{background:var(--pl);border-color:var(--pu)}
.sopa-cell.f0{background:#DCFCE7;color:#15803D}
.sopa-cell.f1{background:#FEF3C7;color:var(--ye)}
.sopa-cell.f2{background:#FCE7F3;color:#DB2777}
.sopa-cell.f3{background:#EDE9FE;color:var(--pu)}
.sopa-cell.f4{background:#DBEAFE;color:#2563EB}
.word-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 4px}
.word-chip{background:#F3F4F6;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;color:var(--mu)}
.word-chip.done{background:#DCFCE7;color:var(--gr);text-decoration:line-through}
/* MATRIX */
.matrix-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:252px;margin:0 auto}
.matrix-cell{width:80px;height:80px;background:#F3F4F6;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1.2;border:2px solid #E5E7EB;text-align:center;word-break:break-all;overflow:hidden}
.matrix-cell.miss{background:var(--pl);border:3px dashed var(--pu);font-size:18px;font-weight:900;color:var(--pu)}
/* SINAN */
.sinan-tag{display:inline-flex;align-items:center;padding:5px 16px;border-radius:999px;font-size:14px;font-weight:900;letter-spacing:1px}
.sinan-sin{background:#DBEAFE;color:#1D4ED8}
.sinan-ant{background:#FCE7F3;color:#DB2777}
/* TIPPAL */
.tippal-word{font-size:38px;font-weight:900;color:var(--pu);letter-spacing:4px;text-align:center}
/* STATS */
.stat-section{background:#fff;border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.stat-section-t{font-size:11px;font-weight:800;color:var(--mu);letter-spacing:.8px;text-transform:uppercase;margin-bottom:12px}
.stat-kpi-row{display:flex;gap:10px;justify-content:space-around;text-align:center}
.stat-kpi{flex:1}
.stat-kpi-n{font-size:30px;font-weight:900;color:var(--pu)}
.stat-kpi-l{font-size:11px;color:var(--mu);font-weight:600;margin-top:2px}
.stat-track-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.stat-track-em{font-size:20px;flex-shrink:0;width:28px;text-align:center}
.stat-track-bar-wrap{flex:1;height:10px;background:#E5E7EB;border-radius:999px;overflow:hidden}
.stat-track-bar{height:100%;border-radius:999px;transition:width .4s}
.stat-track-info{font-size:12px;font-weight:700;color:var(--mu);white-space:nowrap;width:52px;text-align:right}
.hist-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F3F4F6}
.hist-row:last-child{border-bottom:none}
.hist-track{font-size:18px;flex-shrink:0}
.hist-info{flex:1}
.hist-nm{font-size:13px;font-weight:700}
.hist-dt{font-size:11px;color:var(--mu);margin-top:1px}
.hist-stars{font-size:14px;white-space:nowrap}
/* PIN PAD */
.pin-dots{display:flex;gap:14px;justify-content:center;margin:18px 0}
.pin-dot{width:18px;height:18px;border-radius:50%;border:3px solid var(--pu);transition:background .15s}
.pin-dot.filled{background:var(--pu)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto}
.pin-btn{background:#fff;border:2px solid #E5E7EB;border-radius:var(--r);font-size:24px;font-weight:800;padding:16px;cursor:pointer;transition:all .12s}
.pin-btn:active{background:var(--pl);border-color:var(--pu)}
.pin-del{font-size:18px;color:#EF4444;border-color:#FEE2E2}
/* PARENT */
.par-profile{background:#fff;border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);border-left:5px solid var(--pu)}
.par-p2{border-left-color:var(--or)}
.par-profile-hdr{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.par-av{font-size:36px}
.par-nm{font-size:17px;font-weight:900}
.par-kpi-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.par-kpi{background:#F3F4F6;border-radius:10px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--tx)}
.weak-chip{display:inline-flex;align-items:center;gap:4px;background:#FEF3C7;color:#92400E;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;margin:2px}
/* CURIOSIDAD */
.curio-card{background:linear-gradient(135deg,#1E40AF,#7C3AED);border-radius:var(--r);padding:18px;color:#fff;text-align:center;width:100%}
.curio-em{font-size:52px;margin-bottom:6px}
.curio-q{font-size:17px;font-weight:800;line-height:1.6;margin-bottom:12px}
.curio-link{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.2);border-radius:12px;padding:11px 16px;color:#fff;font-weight:700;font-size:14px;cursor:pointer;border:none;text-decoration:none;width:100%;margin-bottom:8px;box-sizing:border-box}
.curio-link:active{opacity:.75}
.curio-link-yt{background:rgba(239,68,68,.8)!important}
.curio-fact{background:#F0FDF4;border-radius:12px;padding:13px;font-size:13px;color:#065F46;font-weight:600;line-height:1.65;border-left:4px solid var(--gr);text-align:left;width:100%;box-sizing:border-box}
</style>

function blankT(){ return {unlocked:1,done:{}}; }
function blankWeak(){ return {comp:{},ana:{},err:{},dict:{},geo:{},logic:{},calc:{},prob:{},lect:{},grp:{},seq:{},curio:{},frac:{},med:{},sinan:{},tippal:{},analog:{},matrix:{},cien:{},acent:{}}; }
function blankP(n,e){ return {name:n,emoji:e,math:blankT(),lang:blankT(),logic:blankT(),curio:blankT(),cien:blankT(),coins:0,earned:0,maxStreak:0,hadPerfect:false,achievements:[],avatars:[e],weak:blankWeak()}; }

function loadProfiles(){
  try{
    let s=localStorage.getItem('ss_v7');if(s)return JSON.parse(s);
    // Migrate from v6/v5
    s=localStorage.getItem('ss_v6')||localStorage.getItem('ss_v5');
    if(s){
      const d=JSON.parse(s);
      ['p1','p2'].forEach(id=>{
        if(!d[id].weak)d[id].weak=blankWeak();
        ['comp','ana','err','dict','geo','logic','calc','prob','lect','grp','seq','curio','frac','med','sinan','tippal','analog','matrix','cien','acent'].forEach(t=>{if(!d[id].weak[t])d[id].weak[t]={};});
        if(!d[id].logic)d[id].logic={unlocked:1,done:{}};
        if(!d[id].curio)d[id].curio={unlocked:1,done:{}};
        if(!d[id].cien)d[id].cien={unlocked:1,done:{}};
      });
      return d;
    }
  }catch(e){}
  return {p1:blankP('Explorador 1','🐍'),p2:blankP('Explorador 2','🦊')};
}
function saveP(){ localStorage.setItem('ss_v7',JSON.stringify(ST.profiles)); }

const ST={profiles:loadProfiles(),pid:null,gs:null};
const P=()=>ST.profiles[ST.pid];

function totalStars(p){
  let t=0;
  for(const v of Object.values(p.math.done)) t+=v;
  for(const v of Object.values(p.lang.done)) t+=v;
  if(p.logic)   for(const v of Object.values(p.logic.done))   t+=v;
  if(p.curio)   for(const v of Object.values(p.curio.done))   t+=v;
  if(p.cien) for(const v of Object.values(p.cien.done)) t+=v;
  return t;
}

    streak_10:   ()=>p.maxStreak>=10,
    math_lvl4:   ()=>p.math.unlocked>=5,
    math_done:   ()=>mD.length>=8,
    lang_lvl4:   ()=>p.lang.unlocked>=5,
    lang_done:   ()=>lD.length>=8,
    champion:    ()=>mD.length>=8&&lD.length>=8,
    coins_200:   ()=>p.earned>=200,
    shopper:     ()=>p.avatars.length>=2,
    collector:   ()=>p.avatars.length>=5,
    triple_star: ()=>aD.filter(s=>s===3).length>=5,
    logic_done:  ()=>lgD.length>=6,
    curio_done:  ()=>cD.length>=6,
    cien_done:   ()=>ciD.length>=6,
    master:      ()=>mD.length>=8&&lD.length>=8&&lgD.length>=6&&cD.length>=6&&ciD.length>=6
  };
  const news=[];
  for(const a of ACHS){
    if(!has.has(a.id)&&cond[a.id]&&cond[a.id]()){
      p.achievements.push(a.id);
      news.push(a);
    }
  }
  return news;
}

// Get the weak-items dict for a content type (mutates profile safely)
function getW(type){
  const p=P();
  if(!p.weak) p.weak=blankWeak();
  if(!p.weak[type]) p.weak[type]={};
  return p.weak[type];
}

// Mark an item correct (reduce error count) or wrong (increase error count)
function markW(type, key, correct){
  const w=getW(type);
  if(!correct){
    w[key]=(w[key]||0)+1;
  } else if(w[key]>0){
    w[key]--;
    if(w[key]===0) delete w[key];
  }
}

// Count total weak items across content types for a profile
function totalWeak(p){
  if(!p.weak) return 0;
  return ['comp','ana','err','dict','geo','logic','prob','lect','grp','seq','curio','frac','med','sinan','tippal','analog','matrix','cien','acent'].reduce((t,k)=>t+Object.keys(p.weak[k]||{}).length,0);
}

// Count weak items relevant to a specific level
function lvlWeak(track, lv){
  const p=P(); if(!p.weak) return 0;
  const w=p.weak;
  if(lv.tp==='calc'){const c=w.calc||{};return (c[`${lv.id}_add`]>0?1:0)+(c[`${lv.id}_sub`]>0?1:0);}
  if(lv.tp==='mult'){const c=w.calc||{};return Object.keys(c).filter(k=>k.startsWith(`${lv.id}_`)).length;}
  if(lv.tp==='geo') return Object.keys(w.geo||{}).length;
  if(lv.tp==='logic') return Object.keys(w.logic||{}).length;
  if(lv.tp==='comp'){const rel=lv.p.f==='all'?compQ:compQ.filter(x=>x.t===lv.p.f);const wk=new Set(Object.keys(w.comp||{}));return rel.filter(x=>wk.has(x.w)).length;}
  if(lv.tp==='ana'){const rel=anaQ.filter(a=>lv.p.sh?a.len<=4:a.len>=5);const wk=new Set(Object.keys(w.ana||{}));return rel.filter(a=>wk.has(a.sc)).length;}
  if(lv.tp==='err') return Object.keys(w.err||{}).length;
  if(lv.tp==='dict'){const rel=dictQ.filter(d=>d.easy===lv.p.easy);const wk=new Set(Object.keys(w.dict||{}));return rel.filter(d=>wk.has(d.w)).length;}
  if(lv.tp==='prob'){const rel=probQ.filter(x=>x.diff===lv.p.diff);const wk=new Set(Object.keys(w.prob||{}));return rel.filter(x=>wk.has(x.prb.slice(0,18))).length;}
  if(lv.tp==='lect'){const rel=lectQ.filter(x=>x.diff===lv.p.diff);const wk=new Set(Object.keys(w.lect||{}));return rel.filter(x=>wk.has(x.q.slice(0,14))).length;}
  if(lv.tp==='grp'){return Object.keys(w.grp||{}).length;}
  if(lv.tp==='seq'){return Object.keys(w.seq||{}).length;}
  if(lv.tp==='curio'){const rel=lv.p.cat==='all'?curioQ:curioQ.filter(x=>x.cat===lv.p.cat);const wk=new Set(Object.keys(w.curio||{}));return rel.filter(x=>wk.has(x.q.slice(0,15))).length;}
  if(lv.tp==='sopa'||lv.tp==='sudoku') return 0;
  if(lv.tp==='frac')   return Object.keys(w.frac||{}).length;
  if(lv.tp==='med')    return Object.keys(w.med||{}).length;
  if(lv.tp==='sinan')  return Object.keys(w.sinan||{}).length;
  if(lv.tp==='tippal') return Object.keys(w.tippal||{}).length;
  if(lv.tp==='analog') return Object.keys(w.analog||{}).length;
  if(lv.tp==='matrix') return Object.keys(w.matrix||{}).length;
  if(lv.tp==='cien'){const rel=lv.p.cat==='all'?cienQ:cienQ.filter(x=>x.cat===lv.p.cat);const wk=new Set(Object.keys(w.cien||{}));return rel.filter(x=>wk.has(x.q.slice(0,20))).length;}
  if(lv.tp==='acent') return Object.keys(w.acent||{}).length;
  return 0;
}

// Build annotated pool: marks each item with _wk, _type, _key, _disp
// Weak items are shuffled into the first half so they appear early
function smartPool(type, allItems, keyFn, dispFn){
  const w=getW(type);
  const annotated=allItems.map(item=>{
    const key=keyFn(item);
    return {...item,_wk:(w[key]||0)>0,_type:type,_key:key,_disp:dispFn?dispFn(item):''};
  });
  const wkItems=shuffle(annotated.filter(x=>x._wk));
  const nrItems=shuffle(annotated.filter(x=>!x._wk));
  if(!wkItems.length) return nrItems;
  // Place weak items within first 65% of slots, rest normal
  const total=annotated.length;
  const earlyMax=Math.ceil(total*.65);
  const earlySlots=shuffle([...Array(earlyMax).keys()]).slice(0,wkItems.length);
  const result=new Array(total).fill(null);
  earlySlots.forEach((slot,i)=>result[slot]=wkItems[i]);
  let ni=0;
  for(let i=0;i<total;i++) if(result[i]===null) result[i]=nrItems[ni++];
  return result;
}

// Track a result in the current game session (for results screen)
function trackResult(item, ok){
  const gs=ST.gs;
  if(!item||!item._type) return;
  markW(item._type, item._key, ok);
  if(!ok) gs.newErrors=(gs.newErrors||[]).concat([item._disp||item._key]);
  else if(item._wk) gs.weakFixed=(gs.weakFixed||[]).concat([item._disp||item._key]);
}

   MATH GENERATOR
══════════════════════════════════════ */
// subBias: probability of generating subtraction (0-1, default 0.5)
// carry:true forces the ones column to require carrying/borrowing
function genCalc({ops,mx,carry}, subBias){
  const b=subBias!==undefined?subBias:.5;
  const add=ops.length===1?ops[0]==='add':Math.random()>b;
  let a,n,attempts=0;
  do{
    if(carry){
      // Two-digit operands for carrying practice
      if(add){a=Math.floor(Math.random()*80)+10;n=Math.floor(Math.random()*Math.min(80,Math.max(10,mx-a)))+10;}
      else{a=Math.floor(Math.random()*(mx-20))+30;n=Math.floor(Math.random()*(a-15))+10;}
    }else{
      if(add){a=Math.floor(Math.random()*(mx-1))+1;n=Math.floor(Math.random()*Math.max(1,mx-a))+1;}
      else{a=Math.floor(Math.random()*(mx-1))+2;n=Math.floor(Math.random()*(a-1))+1;}
    }
    attempts++;
  }while(carry&&(add?(a%10+n%10)<10:(a%10>=n%10))&&attempts<40);
  const ans=add?a+n:a-n;
  const op=add?'+':'−';
  const wr=new Set();
  while(wr.size<3){const off=Math.floor(Math.random()*10)+1;const w=Math.random()>.5?ans+off:Math.max(0,ans-off);if(w!==ans&&w>=0)wr.add(w);}
  return {a,b:n,op,ans:String(ans),opts:shuffle([ans,...wr].map(String)),_opType:add?'add':'sub'};
}

function genMult(tables){
  const t=tables[Math.floor(Math.random()*tables.length)];
  const n=Math.floor(Math.random()*9)+2; // 2 to 10
  const ans=t*n;
  const wr=new Set();
  while(wr.size<3){
    const off=(Math.floor(Math.random()*3)+1)*t;
    const w=Math.random()>.5?ans+off:Math.max(t,ans-off);
    if(w!==ans&&w>0)wr.add(w);
  }
  return {a:t,b:n,op:'×',ans:String(ans),opts:shuffle([ans,...wr].map(String)),_opType:'mult'};
}

function endGame(){
  const gs=ST.gs;
  const pct=gs.score/gs.total;
  const stars=pct>=.9?3:pct>=.7?2:pct>=.6?1:0;
  const passed=pct>=.6;

  // Bonus coins
  const bonus=stars===3?200:stars===2?100:stars===1?50:10;
  const totalCoins=gs.coinsThis+bonus;

  // Update profile
  const p=P();
  p.coins+=totalCoins;
  p.earned+=totalCoins;
  p.maxStreak=Math.max(p.maxStreak,gs.maxStreak);
  if(pct===1) p.hadPerfect=true;

  // Level progress
  const td=p[gs.track]||(p[gs.track]={unlocked:1,done:{}});
  const _trkArr=gs.track==='math'?MATH_LVS:gs.track==='lang'?LANG_LVS:gs.track==='logic'?LOGIC_LVS:gs.track==='cien'?CIENCIA_LVS:CURIO_LVS;
  const maxLvs=_trkArr.length;
  const prev=td.done[gs.lvId]||0;
  if(stars>prev) td.done[gs.lvId]=stars;
  if(passed&&gs.lvId===td.unlocked&&td.unlocked<maxLvs) td.unlocked++;

  // Achievements
  const newAchs=checkAchs();
  saveP();
  saveHistory(gs,stars);

  if(stars===3) boom();

  // Show chest
  openChestCeremony(totalCoins,bonus,stars,newAchs,passed,()=>{
    showResults(gs.track,gs.lvId,gs.score,gs.total,stars,passed,newAchs);
  });
}

function showTrack(track){
  const lvs=track==='math'?MATH_LVS:track==='lang'?LANG_LVS:track==='logic'?LOGIC_LVS:track==='cien'?CIENCIA_LVS:CURIO_LVS;
  const maxLvs=lvs.length;
  const td=P()[track]||(P()[track]={unlocked:1,done:{}});
  const titles={math:'Matemáticas 🔢',lang:'Lengua 📝',logic:'Lógica 🧠',curio:'Curiosidad 🔭',cien:'Ciencias 🔬'};
  const title=titles[track];
  const badgeCls=track==='lang'?'lv-badge-g':track==='logic'?'lv-badge-logic':track==='cien'?'lv-badge-cien':'lv-badge-curio';
  const doneN=Object.keys(td.done).length;

  const cards=lvs.map(lv=>{
    const unl=lv.id<=td.unlocked, done=td.done[lv.id]!==undefined, stars=td.done[lv.id]||0;
    const dots=diffDots(lv.df);

    if(!unl) return `<div class="lv-card locked">
      <div class="lv-row"><div class="lv-ic">🔒</div>
      <div class="lv-inf"><div class="lv-nh"><span class="lv-num">Nivel ${lv.id}</span></div>
      <div class="lv-nm" style="color:#9CA3AF">${lv.nm}</div>
      <div class="lv-de">${lv.ds}</div>${dots}</div></div></div>`;

    const wk=lvlWeak(track,lv);
    const wkBadge=wk>0?`<span class="repaso-tag" style="font-size:11px;padding:2px 8px;margin-top:4px;display:inline-flex">💪 ${wk} para repasar</span>`:'';
    const badge=done?`<div style="font-size:16px">${'⭐'.repeat(stars)}</div>`
      :`<div class="lv-badge ${track==='math'?'':badgeCls}">▶ JUGAR</div>`;

    return `<div class="lv-card ${done?`done-${track}`:`u-${track}`}" onclick="startLv('${track}',${lv.id})">
      <div class="lv-row"><div class="lv-ic">${lv.em}</div>
      <div class="lv-inf"><div class="lv-nh"><span class="lv-num">Nivel ${lv.id}</span>${badge}</div>
      <div class="lv-nm">${lv.nm}</div>
      <div class="lv-de">${lv.ds}</div>${wkBadge}${dots}</div></div></div>`;
  }).join('');

  render(`
    ${hdr(title,'home')}
    <div class="screen">
      <div class="map-hdr"><div class="map-t">Tu camino</div><div class="map-p">${doneN}/${maxLvs} superados</div></div>
      ${cards}
      <div style="height:8px"></div>
    </div>
  `);
}

function showShop(){
  const p=P();
  const items=SHOP_ITEMS.map(it=>{
    const own=p.avatars.includes(it.em), cur=p.emoji===it.em;
    let btn;
    if(cur) btn=`<button class="sh-btn sb-cur">✅ Equipado</button>`;
    else if(own) btn=`<button class="sh-btn sb-eq" onclick="equipAv('${it.em}')">Equipar</button>`;
    else if(p.coins>=it.pr) btn=`<button class="sh-btn sb-buy" onclick="buyAv('${it.em}',${it.pr})">🪙 ${it.pr}</button>`;
    else btn=`<button class="sh-btn sb-bk">🪙 ${it.pr}</button>`;
    return `<div class="sh-item ${cur?'active':own?'owned':''}">
      <div class="sh-em">${it.em}</div>
      <div class="sh-nm">${it.nm}</div>
      ${btn}
    </div>`;
  }).join('');

  render(`
    ${hdr('Tienda 🛍️','home')}
    <div class="screen">
      <div class="coins-bar">🪙 ${p.coins} monedas disponibles</div>
      <div style="font-size:13px;color:var(--mu);text-align:center;font-weight:600">Compra avatares y equípalos</div>
      <div class="sh-grid">${items}</div>
      <div style="font-size:12px;color:var(--mu);text-align:center">Ganas monedas respondiendo correctamente y subiendo de nivel</div>
      <div style="height:8px"></div>
    </div>
  `);
}

function buyAv(em,pr){
  const p=P();
  if(p.coins<pr||p.avatars.includes(em)) return;
  p.coins-=pr; p.avatars.push(em); p.emoji=em;
  const news=checkAchs(); saveP();
  if(news.length>0){
    // brief notification
    const ov=document.getElementById('chest-ov');
    ov.innerHTML=`<div class="chest-t">🎉 ¡Logro desbloqueado!</div>${news.map(a=>`<div class="chest-ab">${a.em} <span>${a.nm}</span></div>`).join('')}`;
    ov.className='chest-ov';
    setTimeout(()=>{ov.className='chest-ov out';showShop();},2000);
  } else { showShop(); }
}

function equipAv(em){
  P().emoji=em; saveP(); showShop();
}

/* ══════════════════════════════════════
   GAME LAUNCHER
══════════════════════════════════════ */
function startLv(track,id){
  const allLvs=track==='math'?MATH_LVS:track==='lang'?LANG_LVS:track==='logic'?LOGIC_LVS:track==='cien'?CIENCIA_LVS:CURIO_LVS;
  const lv=allLvs.find(l=>l.id===id);
  const base={track,lvId:id,lv,score:0,streak:0,maxStreak:0,coinsThis:0,lock:false,weakFixed:[],newErrors:[]};
  if(lv.tp==='calc'){
    // Adaptive: bias toward operation type with more errors
    const cw=getW('calc');
    const addErr=cw[`${id}_add`]||0, subErr=cw[`${id}_sub`]||0;
    let subBias=.5;
    if(lv.p.ops.length>1){
      if(subErr>addErr*1.5) subBias=.7;   // more sub (child struggles with it)
      else if(addErr>subErr*1.5) subBias=.3; // more add
    }
    const probs=Array.from({length:lv.p.n},()=>genCalc(lv.p,subBias));
    ST.gs={...base,probs,total:lv.p.n,idx:0}; renderCalc();
  } else if(lv.tp==='mult'){
    const probs=Array.from({length:lv.p.n},()=>genMult(lv.p.tables));
    ST.gs={...base,probs,total:lv.p.n,idx:0}; renderMult();
  } else if(lv.tp==='prob'){
    const all=probQ.filter(x=>x.diff===lv.p.diff);
    const pool=smartPool('prob',all,x=>x.prb.slice(0,18),x=>x.q.slice(0,30));
    ST.gs={...base,words:pool,total:pool.length,idx:0,curOpts:[]}; renderProb();
  } else if(lv.tp==='lect'){
    const all=lectQ.filter(x=>x.diff===lv.p.diff);
    const pool=smartPool('lect',all,x=>x.q.slice(0,14),x=>x.q.slice(0,28));
    ST.gs={...base,words:pool,total:pool.length,idx:0,curOpts:[]}; renderLect();
  } else if(lv.tp==='geo'){
    const pool=smartPool('geo',geoQ,p=>`${p.sh}_${p.ans}`,p=>p.ans);
    ST.gs={...base,probs:pool,total:pool.length,idx:0}; renderGeo();
  } else if(lv.tp==='logic'||lv.tp==='logAll'){
    const pool=smartPool('logic',logicQ,p=>p.q.slice(0,10),p=>p.q.split('\n')[0].slice(0,18));
    ST.gs={...base,probs:pool,total:pool.length,idx:0}; renderLogic();
  } else if(lv.tp==='grp'){
    const pool=smartPool('grp',grpQ,x=>x.ans,x=>x.q.slice(0,22));
    ST.gs={...base,probs:pool,total:pool.length,idx:0,curOpts:[]}; renderGrp();
  } else if(lv.tp==='seq'){
    const pool=smartPool('seq',seqQ,x=>x.q.slice(0,15),x=>x.q.slice(0,30));
    ST.gs={...base,probs:pool,total:pool.length,idx:0,seqState:null}; renderSeq();
  } else if(lv.tp==='sopa'){
    const pool=shuffle([...sopaQ]).slice(0,lv.p.n||sopaQ.length);
    ST.gs={...base,probs:pool,total:pool.length,idx:0,sopaState:null}; renderSopa();
  } else if(lv.tp==='sudoku'){
    const pool=shuffle([...sudokuQ]).slice(0,lv.p.n||3);
    ST.gs={...base,probs:pool,total:pool.length,idx:0,sudState:null}; renderSudoku();
  } else if(lv.tp==='curio'){
    const all=lv.p.cat==='all'?curioQ:curioQ.filter(x=>x.cat===lv.p.cat);
    const pool=smartPool('curio',all,x=>x.q.slice(0,15),x=>x.q.slice(0,30));
    ST.gs={...base,words:pool,total:pool.length,idx:0,curOpts:[]}; renderCurio();
  } else if(lv.tp==='comp'){
    const all=lv.p.f==='all'?compQ:compQ.filter(w=>w.t===lv.p.f);
    const pool=smartPool('comp',all,w=>w.w,w=>w.f);
    ST.gs={...base,words:pool,total:pool.length,idx:0}; renderComp();
  } else if(lv.tp==='ana'){
    const all=lv.p.sh?anaQ.filter(a=>a.len<=4):anaQ.filter(a=>a.len>=5);
    const pool=smartPool('ana',all,a=>a.sc,a=>a.ans);
    ST.gs={...base,words:pool,total:pool.length,idx:0}; renderAna();
  } else if(lv.tp==='err'){
    const pool=smartPool('err',errQ,s=>s.ps[s.ei],s=>`"${s.ps[s.ei]}"`);
    ST.gs={...base,sents:pool,total:pool.length,idx:0}; renderErr();
  } else if(lv.tp==='dict'){
    const all=dictQ.filter(d=>d.easy===lv.p.easy);
    const pool=smartPool('dict',all,d=>d.w,d=>d.w);
    ST.gs={...base,words:pool,total:pool.length,idx:0}; renderDict();
  } else if(lv.tp==='frac'){
    const pool=smartPool('frac',fracQ,x=>x.q.slice(0,20),x=>x.ans);
    ST.gs={...base,probs:pool,total:pool.length,idx:0,curOpts:[]}; renderFrac();
  } else if(lv.tp==='med'){
    const pool=smartPool('med',medQ,x=>x.q.slice(0,20),x=>x.ans);
    ST.gs={...base,probs:pool,total:pool.length,idx:0,curOpts:[]}; renderMed();
  } else if(lv.tp==='sinan'){
    const pool=smartPool('sinan',sinanQ,x=>x.q.slice(0,22),x=>x.ans);
    ST.gs={...base,probs:pool,total:pool.length,idx:0,curOpts:[]}; renderSinan();
  } else if(lv.tp==='tippal'){
    const pool=smartPool('tippal',tippalQ,x=>x.w,x=>x.w);
    ST.gs={...base,probs:pool,total:pool.length,idx:0,curOpts:[]}; renderTippal();
  } else if(lv.tp==='analog'){
    const pool=smartPool('analog',analogQ,x=>x.q.slice(0,20),x=>x.ans);
    ST.gs={...base,probs:pool,total:pool.length,idx:0,curOpts:[]}; renderAnalog();
  } else if(lv.tp==='matrix'){
    const pool=smartPool('matrix',matrixQ,x=>x.q+'_'+x.ans,x=>x.ans);
    ST.gs={...base,probs:pool,total:pool.length,idx:0,curOpts:[]}; renderMatrix();
  } else if(lv.tp==='cien'){
    const all=lv.p.cat==='all'?cienQ:cienQ.filter(x=>x.cat===lv.p.cat);
    const pool=smartPool('cien',all,x=>x.q.slice(0,20),x=>x.ans);
    ST.gs={...base,probs:pool,total:pool.length,idx:0,curOpts:[]}; renderCien();
  } else if(lv.tp==='acent'){
    const pool=smartPool('acent',acentQ,x=>x.w,x=>x.w);
    ST.gs={...base,probs:pool,total:pool.length,idx:0,curOpts:[]}; renderAcent();
  }
}

function progRow(){
  const gs=ST.gs;
  return `<div class="pr-row">

    <span class="streak-p" id="g-str" style="opacity:${gs.streak>=2?1:0}">🔥 x${gs.streak}</span>

function nextOrEnd(renderFn){
  const gs=ST.gs; gs.lock=false; gs.idx++;
  if(gs.idx>=gs.total) endGame(); else renderFn();
}

/* ══════════════════════════════════════
   GAME: CALC

function renderCalc(){
  const gs=ST.gs, p=gs.probs[gs.idx];
  render(`${hdr(`${gs.lv.em} ${gs.lv.nm}`,'math',`Nivel ${gs.lvId}`)}
  <div class="gw">
    ${progRow()}
    <div class="qc">
      <div class="ql">¿Cuánto es?</div>
      <div class="qb">${p.a} ${p.op} ${p.b} = ?</div>
      <div class="opts">${p.opts.map(o=>`<button class="opt" onclick="ansCalc('${o}')">${o}</button>`).join('')}</div>
    </div>
  </div>`);
}
function ansCalc(sel){
  const gs=ST.gs; if(gs.lock)return; gs.lock=true;
  const p=gs.probs[gs.idx], ok=sel===p.ans;
  document.querySelectorAll('.opt').forEach(b=>{
    if(b.textContent===p.ans)b.classList.add('ok');
    else if(b.textContent===sel&&!ok)b.classList.add('no');
  });
  // Track calc errors by operation type + level
  markW('calc',`${gs.lvId}_${p._opType||'add'}`,ok);
  if(!ok) gs.newErrors=(gs.newErrors||[]).concat([`${p.a}${p.op}${p.b}`]);
  if(ok){const c=onCorrect();showFb(true,`${p.a} ${p.op} ${p.b} = ${p.ans}`,()=>nextOrEnd(renderCalc),ST.gs.streak);}
  else{onWrong();showFb(false,`La respuesta era ${p.ans}`,()=>nextOrEnd(renderCalc),0);}
}

function renderProb(){
  const gs=ST.gs, item=gs.words[gs.idx];
  const opts=gs.curOpts=shuffle(item.opts);
  render(`${hdr(`${gs.lv.em} ${gs.lv.nm}`,'math',`Nivel ${gs.lvId}`)}
  <div class="gw">
    ${progRow()}

      <div class="qt" style="align-self:center">${item.q}</div>

/* ══════════════════════════════════════
   GAME: SOPA DE LETRAS
══════════════════════════════════════ */
function buildSopaGrid(puzzle){
  const {size,placements}=puzzle;
  const ALPHA='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const grid=Array.from({length:size},(_,r)=>Array.from({length:size},(_,c)=>({letter:ALPHA[Math.floor(Math.random()*26)],r,c,fc:-1})));
  placements.forEach(({w,r,c,dir})=>{
    for(let i=0;i<w.length;i++){
      if(dir==='h')grid[r][c+i].letter=w[i];
      else grid[r+i][c].letter=w[i];
    }
  });
  return grid;
}
function getLineWord(grid,r1,c1,r2,c2){
  const dr=Math.sign(r2-r1), dc=Math.sign(c2-c1);
  if(dr!==0&&dc!==0)return null;
  if(dr===0&&dc===0)return null;
  let word='',r=r1,c=c1,steps=0;
  while(steps<10){
    if(r<0||r>=grid.length||c<0||c>=grid[0].length)break;
    word+=grid[r][c].letter;
    if(r===r2&&c===c2)break;
    r+=dr;c+=dc;steps++;
  }
  return word;
}
function markWordCells(s,r1,c1,r2,c2,colorIdx){
  const dr=Math.sign(r2-r1), dc=Math.sign(c2-c1);
  let r=r1,c=c1;
  while(true){s.grid[r][c].fc=colorIdx;if(r===r2&&c===c2)break;r+=dr;c+=dc;}
}
function renderSopa(){
  const gs=ST.gs;
  if(!gs.sopaState||gs.sopaState.puzzleIdx!==gs.idx){
    const item=gs.probs[gs.idx];
    gs.sopaState={grid:buildSopaGrid(item),words:item.words,foundWords:new Set(),start:null,foundAll:false,puzzleIdx:gs.idx};
  }
  const s=gs.sopaState, item=gs.probs[gs.idx];
  const cells=s.grid.map(row=>row.map(cell=>{
    const isSel=s.start&&s.start.r===cell.r&&s.start.c===cell.c;
    const fCls=cell.fc>=0?`f${cell.fc}`:'';
    return `<div class="sopa-cell ${fCls} ${isSel?'sel':''}" onclick="tapSopa(${cell.r},${cell.c})">${cell.letter}</div>`;
  }).join('')).join('');
  const wordList=s.words.map(w=>`<div class="word-chip ${s.foundWords.has(w)?'done':''}">${w}</div>`).join('');
  render(`${hdr(`${gs.lv.em} ${gs.lv.nm}`,'logic',`Nivel ${gs.lvId}`)}
  <div class="gw" style="overflow-y:auto">
    ${progRow()}
    <div class="qc" style="gap:10px;flex:none;padding:14px 12px">
      <div class="ql">🔍 Encuentra las palabras — ${item.nm} ${item.em}</div>
      <div class="sopa-wrap">
        <div class="sopa-grid" style="grid-template-columns:repeat(${item.size},1fr)">${cells}</div>
      </div>
      <div class="word-list">${wordList}</div>
      <div style="font-size:12px;color:var(--mu);text-align:center">${s.start?'🟣 Toca la última letra de la palabra':'Toca la 1ª letra de una palabra'}</div>
    </div>
  </div>`);
}
function tapSopa(r,c){
  const gs=ST.gs; if(gs.lock)return;
  const s=gs.sopaState;
  if(s.foundAll)return;
  if(!s.start){s.start={r,c};renderSopa();return;}
  const {r:r1,c:c1}=s.start; s.start=null;
  const word=getLineWord(s.grid,r1,c1,r,c);
  if(word){
    const wIdx=s.words.indexOf(word);
    if(wIdx>=0&&!s.foundWords.has(word)){
      s.foundWords.add(word);
      markWordCells(s,r1,c1,r,c,s.foundWords.size-1);
      if(s.foundWords.size===s.words.length){
        s.foundAll=true;
        gs.score++;
        gs.lock=true;
        // give coins manually
        const coins=coinsForStreak(++gs.streak);
        gs.coinsThis+=coins;
        gs.maxStreak=Math.max(gs.maxStreak,gs.streak);
        renderSopa();
        setTimeout(()=>{gs.lock=false;nextOrEnd(renderSopa);},1200);
        return;
      }
    }
  }
  renderSopa();
}

/* ══════════════════════════════════════
   GAME: MINI SUDOKU 4×4
══════════════════════════════════════ */
function renderSudoku(){
  const gs=ST.gs;
  if(!gs.sudState||gs.sudState.puzzleIdx!==gs.idx){
    const item=gs.probs[gs.idx];
    const puz=item.puz.map(r=>[...r]);
    gs.sudState={puz,sol:item.sol,sel:null,errCells:{},puzzleIdx:gs.idx,done:false};
  }
  const s=gs.sudState, item=gs.probs[gs.idx];
  const blanks=item.puz.flat().filter(v=>v===0).length;
  const filled=item.puz.reduce((t,row,r)=>t+row.reduce((t2,v,c)=>t2+(v===0&&s.puz[r][c]===s.sol[r][c]?1:0),0),0);
  const cells=[];
  for(let r=0;r<4;r++){
    for(let c=0;c<4;c++){
      const fixed=item.puz[r][c]!==0;
      const val=s.puz[r][c];
      const isSel=s.sel&&s.sel.r===r&&s.sel.c===c;
      const isErr=s.errCells[`${r},${c}`];
      const isGood=!fixed&&val!==0&&!isErr;
      const boxR=c===1?'sdk-box-r':'';
      const boxB=r===1?'sdk-box-b':'';
      const cls=`sdk-cell ${fixed?'fixed':''} ${isSel&&!fixed?'sel':''} ${isErr?'err':''} ${isGood&&!isSel?'good':''} ${boxR} ${boxB}`;
      const fn=fixed?'':` onclick="selSdk(${r},${c})"`;
      cells.push(`<div class="${cls.trim()}"${fn}>${val||''}</div>`);
    }
  }
  render(`${hdr(`${gs.lv.em} ${gs.lv.nm}`,'logic',`Nivel ${gs.lvId}`)}
  <div class="gw">
    ${progRow()}

        <div class="sdk-grid">${cells.join('')}</div>

          ${[1,2,3,4].map(n=>`<button class="sdk-num" onclick="numSdk(${n})">${n}</button>`).join('')}
          <button class="sdk-num sdk-del" onclick="numSdk(0)">✕</button>
        </div>
      </div>
      <div style="font-size:13px;color:var(--mu);font-weight:700;text-align:center">✏️ Toca una casilla vacía → toca un número · ${filled}/${blanks} completados</div>
    </div>
  </div>`);
}
function selSdk(r,c){const gs=ST.gs;gs.sudState.sel={r,c};renderSudoku();}
function numSdk(n){
  const gs=ST.gs; if(gs.sudState.done)return;
  const s=gs.sudState;
  if(!s.sel)return;
  const {r,c}=s.sel;
  if(n===0){s.puz[r][c]=0;delete s.errCells[`${r},${c}`];renderSudoku();return;}
  s.puz[r][c]=n;
  const ok=n===s.sol[r][c];
  if(ok){
    delete s.errCells[`${r},${c}`];
    s.sel=null;
    // Check if puzzle complete
    const item=gs.probs[gs.idx];
    const allDone=item.puz.every((row,rr)=>row.every((v,cc)=>v!==0||s.puz[rr][cc]===s.sol[rr][cc]));
    if(allDone){
      s.done=true;
      gs.score++;
      gs.lock=true;
      const coins=coinsForStreak(++gs.streak);
      gs.coinsThis+=coins;
      gs.maxStreak=Math.max(gs.maxStreak,gs.streak);
      renderSudoku();
      setTimeout(()=>{gs.lock=false;nextOrEnd(renderSudoku);},1000);
      return;
    }
    renderSudoku();
  } else {
    s.errCells[`${r},${c}`]=true;
    gs.streak=0;
    const sp=document.getElementById('g-str');if(sp)sp.style.opacity='0';
    renderSudoku();
    setTimeout(()=>{if(gs.sudState){s.puz[r][c]=0;delete s.errCells[`${r},${c}`];renderSudoku();}},700);
  }
}

function activitySVG(dayMap){
  const days=Object.values(dayMap), maxV=Math.max(...days,1);
  const labels=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const bW=30,gap=10,H=80,entries=Object.entries(dayMap);
  const totalW=entries.length*(bW+gap)-gap;
  const bars=entries.map(([d,n],i)=>{
    const bH=n===0?3:Math.max(8,Math.round((n/maxV)*(H-22)));
    const x=i*(bW+gap), y=H-20-bH;
    const lbl=labels[new Date(parseInt(d)*864e5).getDay()];
    return `<rect x="${x}" y="${y}" width="${bW}" height="${bH}" fill="${n>0?'#7C3AED':'#E5E7EB'}" rx="4"/>
      <text x="${x+bW/2}" y="${H-4}" text-anchor="middle" font-size="10" fill="#6B7280" font-family="sans-serif">${lbl}</text>
      ${n>0?`<text x="${x+bW/2}" y="${y-4}" text-anchor="middle" font-size="10" fill="#7C3AED" font-weight="700" font-family="sans-serif">${n}</text>`:''}`;
  }).join('');
  return `<svg viewBox="0 0 ${totalW} ${H}" style="width:100%;max-width:320px;display:block;margin:0 auto">${bars}</svg>`;
}

function showStats(){
  const p=P();
  const hist=getHistory().filter(x=>x.pid===ST.pid);
  const now=Date.now(), day=864e5;

  // 7-day activity
  const dayMap={};
  for(let i=6;i>=0;i--){
    const d=Math.floor((now-i*day)/day);
    dayMap[d]=0;
  }
  hist.filter(h=>now-h.ts<7*day).forEach(h=>{
    const d=Math.floor(h.ts/day);
    if(dayMap[d]!==undefined)dayMap[d]++;
  });
  const activeDays=Object.values(dayMap).filter(v=>v>0).length;

  // By track
  const tracks={math:{n:0,stars:0,tot:MATH_LVS.length},lang:{n:0,stars:0,tot:LANG_LVS.length},logic:{n:0,stars:0,tot:LOGIC_LVS.length},curio:{n:0,stars:0,tot:CURIO_LVS.length}};
  hist.forEach(h=>{if(tracks[h.track]){tracks[h.track].n++;tracks[h.track].stars+=h.stars;}});
  const maxTrackN=Math.max(...Object.values(tracks).map(t=>t.n),1);

  const trackRows=Object.entries(tracks).map(([k,t])=>{
    const pct=t.n?Math.round(t.n/maxTrackN*100):0;
    const col={math:'#7C3AED',lang:'#16A34A',logic:'#7C3AED',curio:'#0EA5E9'}[k];
    const avg=t.n?'⭐'.repeat(Math.round(t.stars/t.n)):'-';
    return `<div class="stat-track-row">
      <div class="stat-track-em">${trackEmoji(k)}</div>
      <div class="stat-track-bar-wrap"><div class="stat-track-bar" style="width:${pct}%;background:${col}"></div></div>
      <div class="stat-track-info">${t.n} / ${avg}</div>
    </div>`;
  }).join('');

  // Recent sessions (last 10)
  const recent=hist.slice(-10).reverse();
  const histRows=recent.length?recent.map(h=>`
    <div class="hist-row">
      <div class="hist-track">${trackEmoji(h.track)}</div>
      <div class="hist-info">
        <div class="hist-nm">Nv.${h.lvId} ${lvName(h.track,h.lvId).slice(0,22)}</div>
        <div class="hist-dt">${trackName(h.track)} · ${relTime(h.ts)} · ${h.score}/${h.total}</div>
      </div>
      <div class="hist-stars">${h.stars?'⭐'.repeat(h.stars):'—'}</div>
    </div>`).join('')
    :`<div style="color:var(--mu);font-size:14px;text-align:center;padding:12px">Aún no hay sesiones guardadas</div>`;

  const bestStreak=p.maxStreak||0;
  const totalStarsN=totalStars(p);

  render(`
    ${hdr(`📊 Estadísticas`,'home',p.name)}
    <div class="screen">
      <div class="stat-section">
        <div class="stat-kpi-row">
          <div class="stat-kpi"><div class="stat-kpi-n">${hist.length}</div><div class="stat-kpi-l">Sesiones</div></div>
          <div class="stat-kpi"><div class="stat-kpi-n">${activeDays}</div><div class="stat-kpi-l">Días activo</div></div>
          <div class="stat-kpi"><div class="stat-kpi-n">${bestStreak}</div><div class="stat-kpi-l">Racha máx.</div></div>
          <div class="stat-kpi"><div class="stat-kpi-n">⭐${totalStarsN}</div><div class="stat-kpi-l">Estrellas</div></div>
        </div>
      </div>

      <div class="stat-section">
        <div class="stat-section-t">📅 Actividad últimos 7 días</div>
        ${activitySVG(dayMap)}
      </div>

      <div class="stat-section">
        <div class="stat-section-t">🎯 Sesiones por materia (sesiones / media ⭐)</div>
        ${trackRows}
      </div>

      <div class="stat-section">
        <div class="stat-section-t">🕐 Sesiones recientes</div>
        ${histRows}
      </div>
      <div style="height:8px"></div>
    </div>
  `);
}

let _pin='';

function showParentPin(){

}
function _renderPin(err){
  const cfg=_getCfg();
  const isDefault=cfg.pin==='1234';
  const dots=Array.from({length:4},(_,i)=>`<div class="pin-dot ${i<_pin.length?'filled':''}"></div>`).join('');
  render(`
    ${hdr('Modo Padres 🔒','home')}

      <div style="text-align:center;padding:16px 0 0">

      </div>
      <div class="pin-dots">${dots}</div>
      ${err?`<div style="color:var(--re);font-size:14px;font-weight:700">${err}</div>`:''}
      <div class="pin-pad">

function pinKey(k){
  const cfg=_getCfg();
  if(k==='C'){_pin='';_renderPin('');return;}
  if(k==='<'){_pin=_pin.slice(0,-1);_renderPin('');return;}
  _pin+=k;
  if(_pin.length===4){
    if(_pin===cfg.pin){showParent();}
    else{const wrong=_pin;_pin='';setTimeout(()=>_renderPin('PIN incorrecto ❌'),50);}
    return;
  }
  _renderPin('');
}

function topWeak(p,n=4){
  const all=[];
  Object.entries(p.weak||{}).forEach(([type,items])=>{
    Object.entries(items).forEach(([key,cnt])=>{if(cnt>0)all.push({type,key,cnt});});
  });
  return all.sort((a,b)=>b.cnt-a.cnt).slice(0,n);
}

function profileCard(pid){
  const p=ST.profiles[pid];
  const hist=getHistory().filter(x=>x.pid===pid);
  const now=Date.now(),day=864e5;
  const week=hist.filter(h=>now-h.ts<7*day).length;
  const mD=Object.keys(p.math.done).length,lD=Object.keys(p.lang.done).length;
  const lgD=Object.keys(p.logic?.done||{}).length,cD=Object.keys(p.curio?.done||{}).length;
  const ciD=Object.keys(p.cien?.done||{}).length;
  const totalLvs=MATH_LVS.length+LANG_LVS.length+LOGIC_LVS.length+CURIO_LVS.length+CIENCIA_LVS.length;
  const doneLvs=mD+lD+lgD+cD+ciD;
  const weak=topWeak(p);
  const weakHtml=weak.length
    ?weak.map(w=>`<span class="weak-chip">💪 ${w.key.slice(0,18)} (${w.cnt}x)</span>`).join('')
    :`<span style="font-size:13px;color:var(--gr);font-weight:600">✅ ¡Sin errores guardados!</span>`;

  // Track progress bars
  const tdata=[
    {k:'math',nm:'Mates',done:mD,tot:MATH_LVS.length,col:'#7C3AED'},
    {k:'lang',nm:'Lengua',done:lD,tot:LANG_LVS.length,col:'#16A34A'},
    {k:'logic',nm:'Lógica',done:lgD,tot:LOGIC_LVS.length,col:'#8B5CF6'},
    {k:'curio',nm:'Curiosidad',done:cD,tot:CURIO_LVS.length,col:'#0EA5E9'},
    {k:'cien',nm:'Ciencias',done:ciD,tot:CIENCIA_LVS.length,col:'#0D9488'}
  ];
  const tBars=tdata.map(t=>`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <div style="font-size:12px;font-weight:700;width:64px;color:var(--mu)">${t.nm}</div>
      <div style="flex:1;height:8px;background:#E5E7EB;border-radius:999px;overflow:hidden">
        <div style="height:100%;width:${Math.round(t.done/t.tot*100)}%;background:${t.col};border-radius:999px"></div>
      </div>
      <div style="font-size:12px;font-weight:700;color:var(--mu);width:36px;text-align:right">${t.done}/${t.tot}</div>
    </div>`).join('');

  return `<div class="par-profile ${pid==='p2'?'par-p2':''}">
    <div class="par-profile-hdr">
      <div class="par-av">${p.emoji}</div>
      <div>
        <div class="par-nm">${p.name}</div>
        <div style="font-size:12px;color:var(--mu);font-weight:600">🪙 ${p.coins} monedas · ⭐ ${totalStars(p)} estrellas</div>
      </div>
    </div>
    <div class="par-kpi-row">
      <div class="par-kpi">📚 ${doneLvs}/${totalLvs} niveles</div>
      <div class="par-kpi">📅 ${week} sesiones esta semana</div>
      <div class="par-kpi">🔥 Racha max: ${p.maxStreak||0}</div>
      <div class="par-kpi">🏅 ${p.achievements.length} logros</div>
    </div>
    <div style="margin:10px 0 6px">${tBars}</div>
    <div style="font-size:11px;font-weight:800;color:var(--mu);letter-spacing:.6px;margin-bottom:6px">PARA PRACTICAR</div>
    <div>${weakHtml}</div>
  </div>`;
}

function showParent(){
  const hist=getHistory().slice(-20).reverse();
  const histRows=hist.length?hist.map(h=>`
    <div class="hist-row">
      <div class="hist-track">${ST.profiles[h.pid]?.emoji||'?'}</div>
      <div class="hist-info">
        <div class="hist-nm">${ST.profiles[h.pid]?.name||h.pid} · ${trackEmoji(h.track)} Nv.${h.lvId}</div>
        <div class="hist-dt">${lvName(h.track,h.lvId).slice(0,26)} · ${relTime(h.ts)} · ${h.score}/${h.total}</div>
      </div>
      <div class="hist-stars">${h.stars?'⭐'.repeat(h.stars):'—'}</div>
    </div>`).join('')
    :`<div style="color:var(--mu);font-size:14px;padding:10px;text-align:center">Aún no hay sesiones guardadas</div>`;

  render(`
    ${hdr('Modo Padres 🔒','home')}
    <div class="screen">
      <div class="card" style="background:linear-gradient(135deg,#1E1B4B,#4C1D95);color:#fff;text-align:center;padding:14px">
        <div style="font-size:13px;font-weight:800;opacity:.7;letter-spacing:1px">RESUMEN FAMILIAR</div>
        <div style="font-size:13px;margin-top:4px;opacity:.85">Sesiones totales: <strong>${getHistory().length}</strong> · Última: <strong>${getHistory().length?relTime(getHistory().at(-1).ts):'nunca'}</strong></div>
      </div>

      ${profileCard('p1')}
      ${profileCard('p2')}

      <div class="stat-section">
        <div class="stat-section-t">🕐 Historial reciente (ambos)</div>
        ${histRows}
      </div>

      <div class="card" style="display:flex;flex-direction:column;gap:10px">
        <div style="font-size:14px;font-weight:800">⚙️ Ajustes del modo padres</div>
        <button class="btn btn-gh btn-bl" onclick="changePinScreen()" style="font-size:15px">🔑 Cambiar PIN</button>
        <button class="btn btn-gh btn-bl" onclick="if(confirm('¿Borrar TODO el historial de sesiones?')){localStorage.removeItem(\'ss_hist\');showParent();}">🗑️ Borrar historial</button>
      </div>
      <div style="height:8px"></div>
    </div>
  `);
}

let _cpNewPin='';
function cpKey(k){
  if(k==='C'){_cpNewPin='';_renderChange('');}
  else if(k==='<'){_cpNewPin=_cpNewPin.slice(0,-1);_renderChange('');}
  else{
    _cpNewPin+=k;
    if(_cpNewPin.length===4){
      _saveCfg({pin:_cpNewPin});
      _renderChange('✅ PIN cambiado a '+_cpNewPin);
      setTimeout(()=>showParent(),1200);
    } else _renderChange('');
  }
}
function _renderChange(msg){
  const dots=Array.from({length:4},(_,i)=>`<div class="pin-dot ${i<_cpNewPin.length?'filled':''}"></div>`).join('');
  render(`
    ${hdr('Cambiar PIN','home')}
    <div class="screen" style="align-items:center;gap:14px">
      <div style="font-size:48px;text-align:center">🔑</div>
      <div style="font-size:18px;font-weight:800">Nuevo PIN (4 dígitos)</div>
      <div class="pin-dots">${dots}</div>
      ${msg?`<div style="color:${msg.includes('✅')?'var(--gr)':'var(--re)'};font-size:14px;font-weight:700">${msg}</div>`:''}
      <div class="pin-pad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="pin-btn" onclick="cpKey('${n}')">${n}</button>`).join('')}
        <button class="pin-btn" onclick="cpKey('C')" style="color:#6B7280">C</button>
        <button class="pin-btn" onclick="cpKey('0')">0</button>
        <button class="pin-btn pin-del" onclick="cpKey('<')">⌫</button>
      </div>
      <button class="btn btn-gh" onclick="showParent()">Cancelar</button>
    </div>
  `);
}
function changePinScreen(){
  _cpNewPin='';
  _renderChange('');
}

/* ══════════════════════════════════════
   GAME: CIENCIAS
══════════════════════════════════════ */
function renderCien(){
  const gs=ST.gs, item=gs.probs[gs.idx];
  const opts=gs.curOpts=shuffle([...item.opts]);
  const catLabel={body:'🫀 Cuerpo humano',animals:'🦁 Reino animal',plants:'🌿 Plantas',spain:'🇪🇸 España',history:'🏛️ Historia'}[item.cat]||'🔬 Ciencias';
  render(`${hdr(`${gs.lv.em} ${gs.lv.nm}`,'cien',`Nivel ${gs.lvId}`)}
  <div class="gw">
    ${progRow()}
    <div class="qc" style="gap:12px">
      ${item._wk?'<span class="repaso-tag">💪 Repasando</span>':''}
      <div class="ql">${catLabel}</div>
      <div style="font-size:50px">${item.em}</div>
      <div class="qt" style="font-size:18px;line-height:1.5">${item.q}</div>
      <div class="opts">${opts.map((o,i)=>`<button class="opt" onclick="ansCien(${i})" style="font-size:14px;text-align:left;padding:10px 10px;min-height:46px">${o}</button>`).join('')}</div>
    </div>
  </div>`);
}
function ansCien(idx){
  const gs=ST.gs; if(gs.lock)return; gs.lock=true;
  const item=gs.probs[gs.idx], sel=gs.curOpts[idx], ok=sel===item.ans;
  document.querySelectorAll('.opt').forEach((b,i)=>{
    if(gs.curOpts[i]===item.ans)b.classList.add('ok');
    else if(i===idx&&!ok)b.classList.add('no');
  });
  trackResult(item,ok);
  if(ok){onCorrect();showFb(true,item.fact,()=>nextOrEnd(renderCien),ST.gs.streak);}
  else{onWrong();showFb(false,`Resp.: ${item.ans}`,()=>nextOrEnd(renderCien),0);}
}

   GAME: ACENTUACIÓN

  const gs=ST.gs, item=gs.probs[gs.idx];

  const typeColor={Aguda:'#DC2626',Llana:'#D97706',Esdrújula:'#7C3AED'};

  <div class="gw">
    ${progRow()}
    <div class="qc" style="gap:14px">
      ${item._wk?'<span class="repaso-tag">💪 Repasando</span>':''}
      <div class="ql">´ ¿Es aguda, llana o esdrújula?</div>
      <div class="acent-word">${item.w}</div>
      <div class="acent-syl">${item.sl}</div>
      <div class="tip">🔊 Pronuncia sílaba a sílaba: <strong>${item.sl}</strong><br><span style="font-size:12px;opacity:.8">La sílaba en MAYÚSCULAS es donde más fuerza ponemos</span></div>
      <div class="opts">${opts.map((o,i)=>`<button class="opt" onclick="ansAcent(${i})" style="font-size:16px">${o}</button>`).join('')}</div>
    </div>
  </div>`);
}
function ansAcent(idx){
  const gs=ST.gs; if(gs.lock)return; gs.lock=true;
  const item=gs.probs[gs.idx], sel=gs.curOpts[idx], ok=sel===item.ans;
  document.querySelectorAll('.opt').forEach((b,i)=>{
    if(gs.curOpts[i]===item.ans)b.classList.add('ok');
    else if(i===idx&&!ok)b.classList.add('no');
  });
  trackResult(item,ok);
  if(ok){onCorrect();showFb(true,item.rule,()=>nextOrEnd(renderAcent),ST.gs.streak);}
  else{onWrong();showFb(false,`"${item.w}" es ${item.ans}. ${item.rule}`,()=>nextOrEnd(renderAcent),0);}
}
